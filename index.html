  document.getElementById('sw-role').innerHTML =
    '<button data-on="' + (S.role === 'employee') + '" data-act="role" data-key="employee">' + ic('user', 15) + ' Nhân viên</button>'
    + '<button data-on="' + (S.role === 'manager') + '" data-act="role" data-key="manager">' + ic('shield', 15) + ' Quản lý</button>';
  document.getElementById('sw-theme').innerHTML =
    [['light', 'sun', 'Sáng'], ['dark', 'moon', 'Tối'], ['system', 'monitor', 'Theo hệ thống']].map(function (a) {
      return '<button data-on="' + (S.themeMode === a[0]) + '" data-act="theme" data-key="' + a[0] + '" '
        + 'aria-label="' + a[2] + '" title="' + a[2] + '" style="padding:0 11px">' + ic(a[1], 15) + '</button>';
    }).join('');
}
function renderMain() {
  $main.innerHTML = mainHtml();
  if (!S.loading && !S.error) animateKpis();
}
function renderInsights() {
  var el = document.getElementById('sw-insights');
  if (el) el.innerHTML = insightsHtml();
}
function renderAnalytics() {
  var el = document.getElementById('sw-anl-inner');
  if (el) el.innerHTML = analyticsInnerHtml();
  var f = document.getElementById('sw-ins-foot');
  if (f) f.innerHTML = insFootHtml();
}
function renderBody() {
  var el = document.getElementById('sw-body');
  if (el) el.innerHTML = bodyHtml();
}
function renderGoals() {
  var el = document.getElementById('sw-goal-inner');
  if (el) el.innerHTML = goalInnerHtml();
}
function renderPeriod() {
  var el = document.getElementById('sw-period');
  if (el) el.innerHTML = periodBarHtml();
}
function renderKpi() {
  var el = document.getElementById('sw-kpiwrap');
  if (el) el.innerHTML = kpiHtml();
}
function renderOverlay() {
  var html = '';
  if (S.detailId) html += detailHtml();
  if (S.dialog) {
    var p = S.dialog.id ? findP(S.dialog.id) : null;
    if (S.dialog.type === 'complete' && p) html += completeDialogHtml(p);
    else if (S.dialog.type === 'pause' && p) html += pauseDialogHtml(p);
    else if (S.dialog.type === 'delete' && p) html += deleteDialogHtml(p);
    else if (S.dialog.type === 'wizard') html += wizardHtml();
  }
  $ov.innerHTML = html;
  document.body.style.overflow = (S.detailId || S.dialog) ? 'hidden' : '';
}
function toast(text) {
  var el = document.createElement('div');
  el.className = 'sw-toast';
  el.innerHTML = ic('checkcircle', 17, 'style="color:var(--success)"') + ' ' + esc(text);
  $toasts.appendChild(el);
  setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 2800);
}

/* ══════════════════════════════════════════════════════════════════
   14. NẠP DỮ LIỆU
   ══════════════════════════════════════════════════════════════════ */
function load() {
  S.loading = true; S.error = null; S.kpiAnimated = false; S.chart.animated = false;
  renderMain();
  AIProjectsService.getProjects().then(function (data) {
    S.projects = data; S.loading = false; renderMain();
  }).catch(function () {
    S.error = 'Không tải được danh sách dự án.'; S.loading = false; renderMain();
  });
}

/* ══════════════════════════════════════════════════════════════════
   15. XỬ LÝ SỰ KIỆN
   ══════════════════════════════════════════════════════════════════ */
function actOf(e) {
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  return el;
}

// --- Vùng nội dung chính ---
$main.addEventListener('click', function (e) {
  var el = actOf(e); if (!el) return;
  var act = el.getAttribute('data-act'), id = el.getAttribute('data-id'), key = el.getAttribute('data-key');

  if (act === 'open') { S.detailId = id; UI.assessEdit = false; renderOverlay(); }
  else if (act === 'complete') { S.dialog = { type: 'complete', id: id }; renderOverlay(); }
  else if (act === 'pause') { S.dialog = { type: 'pause', id: id }; renderOverlay(); }
  else if (act === 'sort') {
    S.sort = { key: key, dir: (S.sort.key === key && S.sort.dir === 'asc') ? 'desc' : 'asc' };
    renderBody();
  }
  else if (act === 'toggle-filters') { S.showFilters = !S.showFilters; renderBody(); }
  else if (act === 'reset-filters') {
    S.filters = Object.assign({}, EMPTY_FILTERS); S.q = '';
    document.getElementById('sw-q').value = ''; syncClear(); renderBody(); renderGoals();
  }
  /* ---- Kỳ báo cáo: chỉ ảnh hưởng KPI + biểu đồ + mục tiêu ---- */
  else if (act === 'pmode') {
    S.period.mode = key; S.chart.active = null; S.chart.animated = false;
    S.kpiAnimated = false;
    renderPeriod(); renderKpi(); renderInsights();
  }
  else if (act === 'preset') {
    S.period.mode = 'all'; S.chart.active = null; S.chart.animated = false;
    S.kpiAnimated = false;
    renderPeriod(); renderKpi(); renderInsights();
  }
  else if (act === 'goal-pick') {
    var gk = el.getAttribute('data-goal');
    S.filters.goal = (S.filters.goal === gk) ? 'all' : gk;
    renderGoals(); renderBody();
  }
  else if (act === 'goal-clear') { S.filters.goal = 'all'; renderGoals(); renderBody(); }
  else if (act === 'chart-metric') { S.chart.metric = key; S.chart.active = null; S.chart.animated = false; renderAnalytics(); }
  else if (act === 'retry') { load(); }
});
$main.addEventListener('change', function (e) {
  var el = actOf(e); if (!el) return;
  var act = el.getAttribute('data-act');
  if (act === 'pyear' || act === 'pmonth') {
    S.period[act === 'pyear' ? 'year' : 'month'] = e.target.value;
    S.chart.active = null; S.chart.animated = false; S.kpiAnimated = false;
    renderPeriod(); renderKpi(); renderInsights();
  }
  else if (act === 'chart-year') { S.chart.year = e.target.value; S.chart.active = null; S.chart.animated = false; renderAnalytics(); }
  else if (act.indexOf('filter:') === 0) {
    S.filters[act.slice(7)] = e.target.value;
    renderBody();
    if (act === 'filter:goal') renderGoals();
  }
});
$main.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  var el = actOf(e);
  if (el && el.tagName === 'TR') { S.detailId = el.getAttribute('data-id'); UI.assessEdit = false; renderOverlay(); }
});
// Chạm / rê chuột lên biểu đồ
['mouseover', 'click'].forEach(function (ev) {
  $main.addEventListener(ev, function (e) {
    var g = e.target.closest ? e.target.closest('.hit') : null;
    if (!g) return;
    var i = Number(g.getAttribute('data-i'));
    if (S.chart.active !== i) { S.chart.active = i; renderAnalytics(); }
  });
});
$main.addEventListener('mouseleave', function () {
  if (S.chart.active !== null) { S.chart.active = null; renderAnalytics(); }
}, true);

// --- Tìm kiếm ---
var $q = document.getElementById('sw-q');
function syncClear() { document.getElementById('sw-qclear').hidden = !S.q; }
document.getElementById('sw-qclear').innerHTML = ic('x', 15);
document.getElementById('sw-searchico').innerHTML = ic('search', 17);
$q.addEventListener('input', function () { S.q = $q.value; syncClear(); renderBody(); });
document.getElementById('sw-qclear').addEventListener('click', function () {
  S.q = ''; $q.value = ''; syncClear(); renderBody(); $q.focus();
});

// --- Nút Dự án mới + header ---
document.getElementById('sw-new').innerHTML = ic('plus', 18) + ' Dự án mới';
document.getElementById('sw-new').addEventListener('click', openWizard);
function openWizard() {
  WIZ = {
    step: 0, score: 0, comment: '', addingTool: false,
    draft: { name: '', ownerName: '', department: WIZ_DEPARTMENTS[0], startDate: todayISO(),
      expectedCompletionDate: '', description: '', explanation: '', problem: '',
      proposedSolution: '', tools: [], goal: '', goalNote: '', expectedHoursSavedPerMonth: '' }
  };
  S.dialog = { type: 'wizard' };
  renderOverlay();
}
document.querySelector('.sw-head-tools').addEventListener('click', function (e) {
  var el = actOf(e); if (!el) return;
  var act = el.getAttribute('data-act'), key = el.getAttribute('data-key');
  if (act === 'role') {
    S.role = key; renderHeaderTools();
    if (S.detailId || S.dialog) renderOverlay();
  } else if (act === 'theme') {
    S.themeMode = key; applyTheme(); renderHeaderTools();
  }
});

// --- Lớp phủ ---
$ov.addEventListener('click', function (e) {
  var el = actOf(e); if (!el) return;
  var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');

  if (act === 'close-detail') { S.detailId = null; renderOverlay(); }
  else if (act === 'close-dialog') { S.dialog = null; WIZ = null; renderOverlay(); }

  /* ---- Đánh giá của quản lý ---- */
  else if (act === 'assess-edit') {
    var p0 = findP(S.detailId);
    UI.assessEdit = true;
    UI.assessScore = p0.managerAssessment ? p0.managerAssessment.score : 0;
    UI.assessComment = p0.managerAssessment ? p0.managerAssessment.comment : '';
    renderOverlay();
  }
  else if (act === 'assess-score') {
    var box = document.getElementById('dt-cmt-assess');
    if (box) UI.assessComment = box.value;
    UI.assessScore = Number(el.getAttribute('data-score'));
    renderOverlay();
  }
  else if (act === 'assess-cancel') { UI.assessEdit = false; renderOverlay(); }
  else if (act === 'assess-save') {
    var ta = document.getElementById('dt-cmt-assess');
    var cmt = ta ? ta.value.trim() : '';
    patch(S.detailId, { managerAssessment: asses(UI.assessScore, cmt || 'Không có nhận xét.', todayISO()) },
      { type: 'assessed', text: 'Quản lý chấm khả thi ' + UI.assessScore + '/10' });
    UI.assessEdit = false;
    renderOverlay(); renderPeriod(); renderKpi(); renderAnalytics(); renderGoals(); renderBody();
    toast('Đã lưu đánh giá ' + UI.assessScore + '/10');
  }

  /* ---- Bình luận ---- */
  else if (act === 'cmt-send') {
    var inp = document.getElementById('dt-cmt');
    if (inp && inp.value.trim()) {
      var pp = findP(S.detailId);
      pp.comments.push({ id: 'c' + Date.now(), author: isManager() ? MANAGER.name : 'Bạn',
        text: inp.value.trim(), at: todayISO() });
      renderOverlay();
    }
  }

  /* ---- Đổi trạng thái ---- */
  else if (act === 'start') {
    patch(id, { status: 'in_progress', progress: 5 }, { type: 'started', text: 'Bắt đầu triển khai' });
    renderOverlay(); renderPeriod(); renderKpi(); renderAnalytics(); renderGoals(); renderBody();
    toast('Dự án chuyển sang Đang làm');
  }
  else if (act === 'resume') {
    patch(id, { status: 'in_progress', pauseReason: undefined }, { type: 'resumed', text: 'Tiếp tục triển khai' });
    renderOverlay(); renderPeriod(); renderKpi(); renderAnalytics(); renderGoals(); renderBody();
    toast('Dự án tiếp tục triển khai');
  }
  else if (act === 'complete') { S.dialog = { type: 'complete', id: id }; renderOverlay(); }
  else if (act === 'pause') { S.dialog = { type: 'pause', id: id }; renderOverlay(); }

  /* ---- Xóa dự án: chỉ Quản lý ---- */
  else if (act === 'ask-delete') {
    if (!isManager()) return;                    // chặn cả ở tầng xử lý, không chỉ ẩn nút
    S.dialog = { type: 'delete', id: id }; renderOverlay();
  }
  else if (act === 'delete-confirm') {
    if (!isManager()) return;
    var delId = S.dialog.id, delP = findP(delId);
    var delName = delP ? delP.name : '';
    S.projects = S.projects.filter(function (x) { return x.id !== delId; });
    AIProjectsService.deleteProject(delId);
    window.aiProjects.persistLocal(S.projects);
    S.dialog = null;
    if (S.detailId === delId) S.detailId = null;
    renderOverlay(); renderPeriod(); renderKpi(); renderAnalytics(); renderGoals(); renderBody();
    toast('Đã xóa dự án ' + delName);
  }

  /* ---- Xác nhận hoàn thành ---- */
  else if (act === 'complete-confirm') {
    var date = document.getElementById('cp-d').value;
    var hEl = document.getElementById('cp-h');
    var hours = hEl ? Number(hEl.value) : null;
    var result = document.getElementById('cp-r').value.trim();
    if (!date || (hEl && isNaN(hours))) return;
    var upd = { status: 'completed', progress: 100, actualCompletionDate: date,
      actualResult: result || 'Chưa ghi nhận chi tiết.', pauseReason: undefined };
    if (hEl) upd.actualHoursSavedPerMonth = hours;
    patch(S.dialog.id, upd, { type: 'completed',
      text: hEl ? 'Hoàn thành, giảm thực tế ' + hours + ' h/tháng' : 'Dự án hoàn thành' });
    S.dialog = null;
    renderOverlay(); renderPeriod(); renderKpi(); renderAnalytics(); renderGoals(); renderBody();
    toast('Đã ghi nhận hoàn thành dự án');
  }

  /* ---- Xác nhận tạm dừng ---- */
  else if (act === 'pause-confirm') {
    var reason = document.getElementById('pp-r').value.trim();
    if (!reason) return;
    patch(S.dialog.id, { status: 'paused', pauseReason: reason }, { type: 'paused', text: 'Dự án tạm dừng' });
    S.dialog = null;
    renderOverlay(); renderPeriod(); renderKpi(); renderAnalytics(); renderGoals(); renderBody();
    toast('Dự án đã chuyển sang Tạm dừng');
  }

  /* ---- Trình tạo dự án ---- */
  else if (act === 'wiz-back') {
    if (WIZ.step === 0) { S.dialog = null; WIZ = null; renderOverlay(); }
    else { collectWiz(); WIZ.step--; renderWizardParts(); }
  }
  else if (act === 'wiz-next') { collectWiz(); if (wizValid()) { WIZ.step++; renderWizardParts(); } }
  else if (act === 'wiz-tool') {
    var t = el.getAttribute('data-tool');
    var i2 = WIZ.draft.tools.indexOf(t);
    if (i2 === -1) WIZ.draft.tools.push(t); else WIZ.draft.tools.splice(i2, 1);
    document.getElementById('wz-tools').innerHTML = wizToolsHtml();
    document.getElementById('wz-foot').innerHTML = wizFootHtml();
  }
  else if (act === 'wiz-goal') {
    collectWiz();
    var gc = el.getAttribute('data-goal');
    WIZ.draft.goal = (WIZ.draft.goal === gc) ? '' : gc;   // bam lai de bo chon
    document.getElementById('wz-goals').innerHTML = wizGoalsHtml();
    document.getElementById('wz-goaldetail').innerHTML = wizGoalDetailHtml();
    document.getElementById('wz-foot').innerHTML = wizFootHtml();
  }
  else if (act === 'wiz-tool-add') {
    WIZ.addingTool = true;
    document.getElementById('wz-toolinput').innerHTML = wizToolInputHtml();
    var ni = document.getElementById('wz-newtool');
    if (ni) ni.focus();
  }
  else if (act === 'wiz-tool-save') { saveCustomTool(); }
  else if (act === 'wiz-score') {
    collectWiz();
    WIZ.score = Number(el.getAttribute('data-score'));
    renderWizardParts();
  }
  else if (act === 'wiz-submit') { collectWiz(); submitWizard(); }
});

// Ghi giá trị đang gõ trong wizard vào bản nháp
function collectWiz() {
  if (!WIZ) return;
  var body = document.getElementById('wz-body');
  if (!body) return;
  Array.prototype.forEach.call(body.querySelectorAll('[data-f]'), function (el) {
    var f = el.getAttribute('data-f');
    if (f === 'managerComment') WIZ.comment = el.value;
    else WIZ.draft[f] = el.value;
  });
}
// Luu cong cu do nguoi dung tu nhap
function saveCustomTool() {
  var inp = document.getElementById('wz-newtool');
  if (!inp) return;
  var v = inp.value.trim();
  if (!v) return;
  if (WIZ.draft.tools.indexOf(v) === -1) WIZ.draft.tools.push(v);
  WIZ.addingTool = false;
  document.getElementById('wz-tools').innerHTML = wizToolsHtml();
  document.getElementById('wz-toolinput').innerHTML = wizToolInputHtml();
  document.getElementById('wz-foot').innerHTML = wizFootHtml();
}

$ov.addEventListener('input', function (e) {
  if (!WIZ) return;
  var el = e.target;
  if (el.getAttribute && el.getAttribute('data-f')) {
    var f = el.getAttribute('data-f');
    // Muc 3 & 4: tu dong viet hoa ngay khi go
    if (f === 'ownerName') applyCase(el, titleCase);
    else if (f === 'name') applyCase(el, sentenceCase);
    if (f === 'managerComment') WIZ.comment = el.value; else WIZ.draft[f] = el.value;
    var foot = document.getElementById('wz-foot');
    if (foot) foot.innerHTML = wizFootHtml();
    var hint = document.getElementById('wz-hint');
    if (hint && f === 'expectedHoursSavedPerMonth') {
      hint.textContent = el.value !== '' ? 'Tương đương ' + fmtN(Number(el.value) * 12) + ' h mỗi năm' : '';
    }
  }
  // Thanh trượt tiến độ trong chi tiết: cập nhật nhãn ngay, chưa vẽ lại cả trang
  if (el.id === 'dt-prog') {
    var lab = document.getElementById('dt-proglab');
    var fill = $ov.querySelector('.sw-tl-fill');
    var dot = $ov.querySelector('.sw-tl-dot');
    if (lab) { lab.textContent = el.value + '%'; lab.style.left = el.value + '%'; }
    if (fill) fill.style.width = el.value + '%';
    if (dot) dot.style.left = el.value + '%';
  }
});
$ov.addEventListener('change', function (e) {
  if (e.target.id === 'dt-prog') {
    patch(S.detailId, { progress: Number(e.target.value) });
    renderBody();
  }
  if (WIZ && e.target.getAttribute && e.target.getAttribute('data-f') === 'department') {
    WIZ.draft.department = e.target.value;
  }
});
$ov.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target.id === 'wz-newtool') { e.preventDefault(); saveCustomTool(); return; }
  if (e.key === 'Enter' && e.target.id === 'dt-cmt' && e.target.value.trim()) {
    var pp = findP(S.detailId);
    pp.comments.push({ id: 'c' + Date.now(), author: isManager() ? MANAGER.name : 'Bạn',
      text: e.target.value.trim(), at: todayISO() });
    renderOverlay();
  }
});

function submitWizard() {
  var d = WIZ.draft;
  var id = AIProjectsService.newId();
  var p = mk({
    id: id, name: d.name.trim(), ownerId: 'me', ownerName: d.ownerName.trim(), department: d.department,
    status: 'not_started', startDate: d.startDate, expectedCompletionDate: d.expectedCompletionDate,
    description: d.description.trim(), explanation: d.explanation.trim(),
    problem: d.problem.trim(), proposedSolution: d.proposedSolution.trim(),
    tools: d.tools.slice(), progress: 0,
    goal: d.goal, goalNote: d.goalNote.trim(),
    expectedHoursSavedPerMonth: d.goal === 'TIME' ? (Number(d.expectedHoursSavedPerMonth) || 0) : 0,
    createdAt: todayISO(), updatedAt: todayISO(),
    comments: [], activity: [{ id: id + '-a0', type: 'created', text: 'Dự án được đăng ký', at: todayISO() }]
  });
  if (isManager() && WIZ.score) {
    p.managerAssessment = asses(WIZ.score, WIZ.comment.trim() || 'Không có nhận xét.', todayISO());
    p.activity.push({ id: id + '-a1', type: 'assessed',
      text: 'Quản lý chấm khả thi ' + WIZ.score + '/10', at: todayISO() });
  }
  S.projects.unshift(p);
  AIProjectsService.persistProjects(S.projects).catch(function () {});
  S.dialog = null; WIZ = null;
  S.detailId = id; UI.assessEdit = false;
  renderOverlay(); renderPeriod(); renderKpi(); renderAnalytics(); renderGoals(); renderBody();
  toast('Đã đăng ký dự án mới');
}

// Xoay máy hoặc đổi kích thước cửa sổ: vẽ lại biểu đồ cho khớp bề rộng mới
var lastW = window.innerWidth, resizeTimer = null;
window.addEventListener('resize', function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function () {
    if (Math.abs(window.innerWidth - lastW) < 24) return;
    lastW = window.innerWidth;
    renderAnalytics();
  }, 150);
});

// Phím Escape đóng lớp trên cùng
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if (S.dialog) { S.dialog = null; WIZ = null; renderOverlay(); }
  else if (S.detailId) { S.detailId = null; renderOverlay(); }
});

/* ══════════════════════════════════════════════════════════════════
   16. KHỞI ĐỘNG
   ══════════════════════════════════════════════════════════════════ */
(function init() {
  try {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    S.systemDark = mq.matches;
    if (mq.addEventListener) mq.addEventListener('change', function (ev) {
      S.systemDark = ev.matches; applyTheme();
    });
  } catch (err) { S.systemDark = false; }
  applyTheme();
  renderHeaderTools();
  syncClear();
  load();
})();
</script>
</body>
