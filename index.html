<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI PROJECTS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
window.__AI_PROJECTS_CONFIG__ = {
  supabaseUrl: 'https://ogktngmahfvgcbkckjfi.supabase.co',
  supabaseAnonKey: 'sb_publishable_tb__vxDH8lir1fkhcb9Dew_v6fNAZDS'
};
window.aiProjects = window.aiProjects || {};
window.aiProjects.getConfig = function () {
  var cfg = window.__AI_PROJECTS_CONFIG__ || {};
  return {
    supabaseUrl: (cfg.supabaseUrl || '').trim(),
    supabaseAnonKey: (cfg.supabaseAnonKey || '').trim()
  };
};
window.aiProjects.getSupabaseClient = function () {
  var cfg = this.getConfig();
  if (!cfg.supabaseUrl || !cfg.supabaseAnonKey || !window.supabase) return null;
  if (!this._supabaseClient || this._supabaseClient.url !== cfg.supabaseUrl) {
    this._supabaseClient = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  }
  return this._supabaseClient;
};
window.aiProjects.persistLocal = function (projects) {
  try {
    localStorage.setItem('ai-projects-local-projects', JSON.stringify(projects));
  } catch (err) {}
};
window.aiProjects.readLocal = function () {
  try {
    var raw = localStorage.getItem('ai-projects-local-projects');
    if (!raw) return [];
    var parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch (err) {
    return [];
  }
};
</script>
<style>
/* ══════════════════════════════════════════════════════════════════
   DESIGN TOKENS + STYLES
   Mọi style bọc trong .sw-root / .sw-portal để không đụng CSS app chủ.
   ══════════════════════════════════════════════════════════════════ */
html, body { margin: 0; padding: 0; }
.sw-root, .sw-root *, .sw-portal, .sw-portal * { box-sizing: border-box; }

.sw-root, .sw-portal {
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
             "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
  --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 26px; --r-pill: 999px;
  --dur: 220ms; --ease: cubic-bezier(.32,.72,0,1);
}

.sw-root[data-theme="light"], .sw-portal[data-theme="light"] {
  --bg-1: #F1F1F5; --bg-2: #FFFFFF;
  --surface-1: rgba(255,255,255,.80); --surface-2: rgba(255,255,255,.55);
  --surface-solid: #FFFFFF; --surface-sunken: rgba(120,120,140,.07);
  --text-1: #16161A; --text-2: #5A5A63; --text-3: #8E8E98;
  --border-1: rgba(20,20,40,.09); --border-2: rgba(20,20,40,.16);
  --accent: #4F46E5; --accent-ink: #4338CA; --accent-soft: rgba(79,70,229,.10);
  --success: #17803D; --success-soft: rgba(23,128,61,.11);
  --warning: #A55A00; --warning-soft: rgba(200,120,0,.13);
  --danger:  #C0392B; --danger-soft:  rgba(192,57,43,.11);
  --info:    #0369A1; --info-soft:    rgba(3,105,161,.11);
  --neutral-soft: rgba(90,90,110,.10);
  --filter-bg: rgba(79,70,229,.085); --filter-ink: #3F37C9;
  --shadow-1: 0 1px 2px rgba(16,16,32,.06), 0 1px 1px rgba(16,16,32,.04);
  --shadow-2: 0 4px 16px rgba(16,16,32,.08), 0 1px 3px rgba(16,16,32,.05);
  --shadow-3: 0 24px 60px rgba(16,16,32,.18), 0 4px 12px rgba(16,16,32,.08);
  --glow-a: rgba(79,70,229,.13); --glow-b: rgba(6,182,212,.11);
  --scrim: rgba(30,30,45,.30);
}
.sw-root[data-theme="dark"], .sw-portal[data-theme="dark"] {
  --bg-1: #1B1B1F; --bg-2: #232328;
  --surface-1: rgba(46,46,54,.72); --surface-2: rgba(46,46,54,.45);
  --surface-solid: #26262C; --surface-sunken: rgba(255,255,255,.05);
  --text-1: #F2F2F5; --text-2: #A9A9B4; --text-3: #77777F;
  --border-1: rgba(255,255,255,.09); --border-2: rgba(255,255,255,.16);
  --accent: #8B87FF; --accent-ink: #A5A1FF; --accent-soft: rgba(139,135,255,.15);
  --success: #4ADE80; --success-soft: rgba(74,222,128,.14);
  --warning: #FBBF24; --warning-soft: rgba(251,191,36,.14);
  --danger:  #FF7A6E; --danger-soft:  rgba(255,122,110,.14);
  --info:    #6FD3F7; --info-soft:    rgba(111,211,247,.14);
  --neutral-soft: rgba(255,255,255,.08);
  --filter-bg: rgba(139,135,255,.16); --filter-ink: #C8C5FF;
  --shadow-1: 0 1px 2px rgba(0,0,0,.35);
  --shadow-2: 0 4px 18px rgba(0,0,0,.42);
  --shadow-3: 0 28px 70px rgba(0,0,0,.62);
  --glow-a: rgba(139,135,255,.16); --glow-b: rgba(45,212,191,.10);
  --scrim: rgba(0,0,0,.55);
}

.sw-root {
  position: relative; font-family: var(--font-ui);
  color: var(--text-1); background: var(--bg-1); min-height: 100vh;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  font-size: 15px; line-height: 1.5; letter-spacing: -0.006em;
}
.sw-portal { font-family: var(--font-ui); color: var(--text-1); }
.sw-ico { display: inline-block; vertical-align: -0.15em; flex-shrink: 0; }

.sw-ambient { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
.sw-ambient::before, .sw-ambient::after { content: ""; position: absolute; border-radius: 50%; filter: blur(90px); }
.sw-ambient::before { width: 620px; height: 620px; top: -280px; left: -140px; background: var(--glow-a); }
.sw-ambient::after  { width: 520px; height: 520px; top: -220px; right: -160px; background: var(--glow-b); }

.sw-shell { position: relative; z-index: 1; max-width: 1440px; margin: 0 auto; padding: 28px 24px 96px; }
@media (max-width: 900px) { .sw-shell { padding: 20px 16px 96px; } }

/* ---------- Primitives ---------- */
.sw-card { background: var(--surface-1); border: 1px solid var(--border-1);
  border-radius: var(--r-lg); box-shadow: var(--shadow-1);
  backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); }
/* Tiêu đề viết hoa cần giãn chữ dương, khác với chữ thường */
.sw-h1 { font-size: 34px; font-weight: 700; letter-spacing: 0.01em; line-height: 1.14; margin: 0; }
.sw-sub { color: var(--text-2); font-size: 15px; margin: 6px 0 0; max-width: 62ch; }
.sw-h2 { font-size: 19px; font-weight: 650; letter-spacing: -0.018em; margin: 0; }
.sw-meta { font-size: 13px; color: var(--text-3); }
.sw-num { font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
@media (max-width: 700px) { .sw-h1 { font-size: 27px; } }

.sw-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px; border-radius: var(--r-pill);
  border: 1px solid var(--border-1); background: var(--surface-solid); color: var(--text-1);
  font-family: inherit; font-size: 14.5px; font-weight: 560; letter-spacing: -0.008em;
  cursor: pointer; white-space: nowrap;
  transition: transform var(--dur) var(--ease), background var(--dur) var(--ease), border-color var(--dur) var(--ease); }
.sw-btn:hover { border-color: var(--border-2); }
.sw-btn:active { transform: scale(.965); }
.sw-btn--primary { background: var(--accent); border-color: transparent; color: #fff; box-shadow: var(--shadow-2); }
.sw-btn--primary:hover { background: var(--accent-ink); }
.sw-btn--ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.sw-btn--ghost:hover { background: var(--surface-sunken); color: var(--text-1); }
.sw-btn--danger { background: var(--danger-soft); border-color: transparent; color: var(--danger); }
.sw-btn--sm { min-height: 36px; padding: 0 14px; font-size: 13.5px; }
.sw-btn:disabled { opacity: .42; cursor: not-allowed; }

.sw-icon-btn { display: inline-flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; border-radius: var(--r-pill); border: 1px solid var(--border-1);
  background: var(--surface-solid); color: var(--text-2); cursor: pointer;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease), transform var(--dur) var(--ease); }
.sw-icon-btn:hover { color: var(--text-1); }
.sw-icon-btn:active { transform: scale(.92); }

.sw-seg { display: inline-flex; padding: 3px; gap: 3px; background: var(--surface-sunken);
  border-radius: var(--r-pill); border: 1px solid var(--border-1); }
.sw-seg button { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 14px;
  border: 0; background: transparent; color: var(--text-2); border-radius: var(--r-pill);
  font-family: inherit; font-size: 13.5px; font-weight: 560; cursor: pointer;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease); }
.sw-seg button[data-on="true"] { background: var(--surface-solid); color: var(--text-1); box-shadow: var(--shadow-1); }

.sw-field { display: flex; flex-direction: column; gap: 7px; }
.sw-label { font-size: 13px; font-weight: 560; color: var(--text-2); }
.sw-input, .sw-select, .sw-textarea { width: 100%; min-height: 46px; padding: 11px 14px;
  border: 1px solid var(--border-1); border-radius: var(--r-md);
  background: var(--surface-solid); color: var(--text-1);
  font-family: inherit; font-size: 15px; letter-spacing: -0.006em;
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease); }
.sw-textarea { min-height: 92px; resize: vertical; line-height: 1.55; }
.sw-input:focus, .sw-select:focus, .sw-textarea:focus { outline: none;
  border-color: var(--accent); box-shadow: 0 0 0 3.5px var(--accent-soft); }
.sw-input::placeholder, .sw-textarea::placeholder { color: var(--text-3); }
.sw-select { appearance: none; -webkit-appearance: none; padding-right: 36px; cursor: pointer; }
.sw-selwrap { position: relative; }
.sw-selwrap .sw-ico { position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  pointer-events: none; color: var(--text-3); }

.sw-search { position: relative; flex: 1; min-width: 220px; }
.sw-search .lead { position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
  color: var(--text-3); pointer-events: none; }
.sw-search input { padding-left: 44px; padding-right: 44px; border-radius: var(--r-pill); min-height: 46px; }
.sw-search .clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--surface-sunken);
  color: var(--text-2); display: grid; place-items: center; cursor: pointer; }

.sw-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px 4px 9px;
  border-radius: var(--r-pill); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.sw-chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 8px;
  background: var(--surface-sunken); border: 1px solid var(--border-1); color: var(--text-2);
  font-size: 12.5px; font-weight: 540; white-space: nowrap; font-family: inherit; }
.sw-chip--on { background: var(--accent-soft); border-color: transparent; color: var(--accent-ink); }

.sw-bar { height: 7px; border-radius: var(--r-pill); background: var(--surface-sunken); overflow: hidden; }
.sw-bar > i { display: block; height: 100%; border-radius: var(--r-pill); background: var(--accent);
  transition: width 640ms var(--ease); }

/* ---------- Layout ---------- */
.sw-head { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start;
  justify-content: space-between; margin-bottom: 22px; }
.sw-head-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.sw-headbar { display: flex; gap: 12px; align-items: center; margin: 20px 0 26px; flex-wrap: wrap; }
@media (max-width: 640px) { .sw-headbar .sw-btn--new { width: 100%; } }

/* Thanh chọn kỳ báo cáo */
.sw-periodbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 12px 16px; margin-bottom: 16px;
  background: var(--surface-1); border: 1px solid var(--border-1); border-radius: var(--r-pill);
  box-shadow: var(--shadow-1); backdrop-filter: blur(24px) saturate(180%); }
.sw-periodlab { display: inline-flex; align-items: center; gap: 7px;
  font-size: 12px; font-weight: 750; text-transform: uppercase; letter-spacing: .05em; color: var(--text-2); }
.sw-periodbar .sw-psel .sw-select { min-height: 36px; padding: 6px 32px 6px 13px; font-size: 13.5px;
  border-radius: var(--r-pill); background: var(--filter-bg); border-color: transparent;
  color: var(--filter-ink); font-weight: 620; }
.sw-periodbar .sw-psel .sw-ico { color: var(--filter-ink); }
.sw-periodnote { font-size: 13px; color: var(--text-3); margin-left: auto; }
@media (max-width: 700px) {
  .sw-periodbar { border-radius: var(--r-lg); padding: 12px 14px; }
  .sw-periodnote { margin-left: 0; width: 100%; }
  .sw-periodbar .sw-seg { flex: 1; }
  .sw-periodbar .sw-seg button { flex: 1; justify-content: center; }
}

/* 7 thẻ KPI giữ một hàng đến 1280px */
.sw-kpi-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; }
@media (min-width: 1280px) and (max-width: 1440px) {
  .sw-kpi-grid { gap: 9px; }
  .sw-kpi { padding: 14px 12px 12px; }
  .sw-kpi-val { font-size: 26px; }
  .sw-kpi-lab { font-size: 10.5px; letter-spacing: .03em; }
  .sw-kpi-ico { width: 27px; height: 27px; border-radius: 8px; }
  .sw-kpi-note { font-size: 11px; }
}
@media (max-width: 1279px) { .sw-kpi-grid { grid-template-columns: repeat(4, 1fr); } }
@media (max-width: 1024px) { .sw-kpi-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 640px)  { .sw-kpi-grid { grid-template-columns: repeat(2, 1fr); } }

.sw-kpi { padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 10px; min-height: 116px;
  transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease); }
@media (hover: hover) { .sw-kpi:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); } }
.sw-kpi-top { display: flex; align-items: center; gap: 9px; min-height: 34px; }
.sw-kpi-ico { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; flex-shrink: 0; }
.sw-kpi-lab { font-size: 11.5px; font-weight: 750; color: var(--text-2);
  text-transform: uppercase; letter-spacing: .045em; line-height: 1.25; }
.sw-kpi-valrow { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-top: auto; }
.sw-kpi-val { font-size: 30px; font-weight: 680; line-height: 1; }
.sw-kpi-val small { font-size: 15px; font-weight: 560; color: var(--text-3); margin-left: 3px; letter-spacing: 0; }
/* Luôn chiếm chỗ dù rỗng, để 7 con số nằm đúng một đường ngang */
.sw-kpi-note { font-size: 12px; color: var(--text-3); min-height: 17px; line-height: 1.35; }
.sw-kpi-trend { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; }

.sw-section { margin-top: 26px; }
.sw-section-head { display: flex; align-items: center; justify-content: space-between; gap: 14px;
  flex-wrap: wrap; margin-bottom: 14px; }

.sw-analytics { padding: 20px 22px 14px; }
.sw-anl-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.sw-anl-read { display: flex; align-items: baseline; gap: 10px; margin-top: 12px; min-height: 40px; flex-wrap: wrap; }
.sw-anl-read b { font-size: 27px; font-weight: 680; letter-spacing: -0.03em; }
.sw-anl-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
.sw-anl-tab { min-height: 34px; padding: 0 13px; border-radius: var(--r-pill); border: 1px solid var(--border-1);
  background: transparent; color: var(--text-2); font-family: inherit; font-size: 13px; font-weight: 560; cursor: pointer; }
.sw-anl-tab[data-on="true"] { background: var(--accent); border-color: transparent; color: #fff; }
.sw-chart { width: 100%; display: block; margin-top: 8px; touch-action: manipulation; overflow: visible; }
.sw-chart .hit { cursor: pointer; }
.sw-chart .seg > path, .sw-chart .seg > rect + rect, .sw-chart .seg rect:not(:first-child) {
  transition: opacity var(--dur) var(--ease); }
/* Cot moc len tu day khi tai lan dau */
.sw-chart .seg-in { transform-box: fill-box; transform-origin: 50% 100%;
  animation: swgrow 520ms var(--ease) both; animation-delay: var(--d, 0ms); }
@keyframes swgrow { from { transform: scaleY(0); opacity: .3; } }
.sw-chart .tip rect:first-child { filter: drop-shadow(0 4px 14px rgba(0,0,0,.14)); }

/* ---------- Muc tieu du an ---------- */
.sw-goal { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px 4px 9px;
  border-radius: var(--r-pill); font-size: 12.5px; font-weight: 620; white-space: nowrap; }
.sw-goal i { width: 7px; height: 7px; border-radius: 50%; display: block; flex-shrink: 0; }

/* Nut chon muc tieu trong form dang ky */
.sw-goalpick { display: flex; align-items: center; gap: 9px; padding: 10px 14px 10px 11px;
  border: 1.5px solid var(--border-1); border-radius: var(--r-md); background: var(--surface-solid);
  font-family: inherit; cursor: pointer; text-align: left; min-height: 52px; flex: 1 1 210px;
  transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease); }
.sw-goalpick i { width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0;
  border: 2px solid var(--border-2); background: transparent;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease); }
.sw-goalpick span { display: block; font-size: 14px; font-weight: 580; color: var(--text-1); line-height: 1.25; }
.sw-goalpick em { display: block; font-style: normal; font-size: 11.5px; font-weight: 500; color: var(--text-3); }
.sw-goalpick:hover { border-color: var(--gc); }
.sw-goalpick.on { border-color: var(--gc); background: color-mix(in srgb, var(--gc) 9%, transparent); }
.sw-goalpick.on i { background: var(--gc); border-color: var(--gc); box-shadow: inset 0 0 0 2.5px var(--surface-solid); }

/* Khoi vong tron phan bo */
/* Khung ghép: phân tích tháng | phân bổ mục tiêu */
.sw-insights { padding: 20px 22px 14px; }
.sw-ins-cols { display: grid; grid-template-columns: 62fr 38fr; gap: 26px; align-items: start; }
.sw-ins-right { border-left: 1px solid var(--border-1); padding-left: 26px; }
@media (max-width: 1100px) {
  .sw-ins-cols { grid-template-columns: 1fr; gap: 20px; }
  .sw-ins-right { border-left: 0; border-top: 1px solid var(--border-1); padding-left: 0; padding-top: 20px; }
}
@media (max-width: 560px) { .sw-insights { padding: 16px 14px 10px; } }

.sw-goalcard { padding: 20px 22px; }
.sw-goalhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px;
  flex-wrap: wrap; margin-bottom: 16px; }
.sw-goalbody { display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
.sw-donut { width: 150px; height: 150px; flex-shrink: 0; align-self: center; }
.sw-donut .dslice { cursor: pointer; transition: opacity var(--dur) var(--ease), d var(--dur) var(--ease); }
.sw-donut .dslice:hover { opacity: .82 !important; }
.sw-goallist { display: flex; flex-direction: column; gap: 1px; }
.sw-goalrow { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 38px;
  padding: 6px 9px; border: 0; border-radius: var(--r-sm); background: transparent;
  font-family: inherit; cursor: pointer; text-align: left;
  transition: background var(--dur) var(--ease); }
.sw-goalrow:hover { background: var(--surface-sunken); }
.sw-goalrow.on { background: var(--surface-sunken); box-shadow: inset 0 0 0 1.5px var(--border-2); }
.sw-goalrow i { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.sw-goalrow .nm { flex: 1; min-width: 0; font-size: 13px; font-weight: 560; color: var(--text-1); line-height: 1.25; }
.sw-goalrow .nm em { display: block; font-style: normal; font-size: 11px; color: var(--text-3); font-weight: 500; }
.sw-goalrow .pc { font-size: 13.5px; font-weight: 700; min-width: 38px; text-align: right; }
.sw-goalrow .ct { font-size: 13px; color: var(--text-3); min-width: 20px; text-align: right; }
@media (max-width: 700px) {
  .sw-donut { width: 168px; height: 168px; }
}

.sw-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 10px 2px 2px; }
.sw-legend-i { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px;
  color: var(--text-2); font-weight: 540; }
.sw-legend-i i { width: 9px; height: 9px; border-radius: 3px; display: block; }
.sw-anl-foot { display: flex; gap: 22px; flex-wrap: wrap; padding: 14px 2px 4px;
  border-top: 1px solid var(--border-1); margin-top: 16px; }
.sw-anl-foot div span { display: block; font-size: 12.5px; color: var(--text-3); }
.sw-anl-foot div b { font-size: 17px; font-weight: 650; }

function goalDistribution(ps) {
  return GOALS.map(function (g) {
    var n = ps.filter(function (p) { return p.goal === g.code; }).length;
    return { code: g.code, vi: g.vi, en: g.en, color: g.color, count: n,
      pct: ps.length ? (n / ps.length) * 100 : 0 };
  }).filter(function (x) { return x.count > 0; })
    .sort(function (a, b) { return b.count - a.count; });
}

/* ══════════════════════════════════════════════════════════════════
   4. HÀM TIỆN ÍCH + TÍNH TOÁN (tách khỏi phần hiển thị)
   ══════════════════════════════════════════════════════════════════ */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function fmtN(n) { return (n == null ? 0 : n).toLocaleString('vi-VN'); }
function fmtD(iso) {
  if (!iso) return '—';
  var a = String(iso).split('-');
  return a.length === 3 ? a[2] + '/' + a[1] + '/' + a[0] : '—';
}
function todayISO() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function initials(name) {
  var w = String(name).trim().split(/\s+/).slice(-2);
  return w.map(function (x) { return x.charAt(0); }).join('').toUpperCase();
}
function byStatus(ps, s) { return ps.filter(function (p) { return p.status === s; }); }

/* ══ KỲ BÁO CÁO — lũy kế đến hết kỳ ══
   Chiếu một dự án về đúng trạng thái mà nó CÓ tại thời điểm cuối kỳ.
   Ví dụ dự án hoàn thành 10/05/2026, nếu xem đến hết 31/03/2026 thì
   khi đó nó vẫn đang làm, chưa có giờ tiết kiệm thực tế, nên phải bỏ
   các dữ liệu phát sinh sau ngày đó ra khỏi phép tính. */
function projectAsOf(p, endISO) {
  if (p.startDate > endISO) return null;              // chưa khởi động tại thời điểm đó
  var q = {};
  for (var k in p) q[k] = p[k];
  var doneInTime = p.actualCompletionDate && p.actualCompletionDate <= endISO;
  if (doneInTime) {
    q.status = 'completed';
  } else {
    // Chưa hoàn thành tính đến cuối kỳ -> gỡ mọi dữ liệu hoàn thành
    q.actualCompletionDate = undefined;
    q.actualHoursSavedPerMonth = undefined;
    q.actualResult = undefined;
    if (p.status === 'completed') q.status = 'in_progress';
  }
  // Đánh giá khả thi chỉ tính nếu đã chấm trước cuối kỳ
  if (p.managerAssessment && p.managerAssessment.evaluatedAt > endISO) q.managerAssessment = undefined;
  return q;
}
/** Ngày cuối của kỳ đang chọn. Chế độ "Tất cả" trả về mốc vô cực. */
function periodEndISO() {
  if (S.period.mode === 'year') return S.period.year + '-12-31';
  if (S.period.mode === 'month') return S.period.year + '-' + S.period.month + '-31';
  return '9999-12-31';
}
/** Tập dự án đã chiếu về cuối kỳ — dùng cho 3 khung trên (KPI, biểu đồ, mục tiêu) */
function scopedProjects() {
  var end = periodEndISO();
  if (end === '9999-12-31') return S.projects;
  var out = [];
  S.projects.forEach(function (p) {
    var q = projectAsOf(p, end);
    if (q) out.push(q);
  });
  return out;
}
/** Năm dùng để vẽ biểu đồ 12 tháng */
function chartYear() { return S.period.mode === 'all' ? S.chart.year : S.period.year; }
/** Chỉ số tháng cần làm nổi trên biểu đồ, null nếu không lọc theo tháng */
function highlightMonth() {
  return S.period.mode === 'month' ? (Number(S.period.month) - 1) : null;
}
function avgFeasibility(ps) {
  var s = ps.filter(function (p) { return p.managerAssessment; })
            .map(function (p) { return p.managerAssessment.score; });
  return s.length ? s.reduce(function (a, b) { return a + b; }, 0) / s.length : 0;
}
function isTimeGoal(p) { return p.goal === 'TIME'; }
function monthlyHoursSaved(ps) {
  return ps.filter(function (p) { return p.status === 'completed' && isTimeGoal(p); })
    .reduce(function (a, p) { return a + (p.actualHoursSavedPerMonth != null ? p.actualHoursSavedPerMonth : p.expectedHoursSavedPerMonth); }, 0);
}
function totalExpectedHours(ps) {
  return ps.filter(isTimeGoal).reduce(function (a, p) { return a + (p.expectedHoursSavedPerMonth || 0); }, 0);
}
function timeProjectCount(ps) { return ps.filter(isTimeGoal).length; }
function assessedCount(ps) { return ps.filter(function (p) { return p.managerAssessment; }).length; }

/** Thống kê 12 tháng: khởi động / hoàn thành / giờ tiết kiệm lũy kế / khả thi TB lũy kế */
function monthlyStats(ps, year) {
  var out = [];
  for (var m = 0; m < 12; m++) {
    var key = year + '-' + String(m + 1).padStart(2, '0');
    var end = key + '-31';
    var startedList = ps.filter(function (p) { return p.startDate.indexOf(key) === 0; });
    var done = ps.filter(function (p) { return p.actualCompletionDate && p.actualCompletionDate.indexOf(key) === 0; }).length;
    var hours = ps.filter(function (p) { return p.actualCompletionDate && p.actualCompletionDate <= end && isTimeGoal(p); })
      .reduce(function (a, p) { return a + (p.actualHoursSavedPerMonth != null ? p.actualHoursSavedPerMonth : p.expectedHoursSavedPerMonth); }, 0);
    var scored = ps.filter(function (p) { return p.managerAssessment && p.managerAssessment.evaluatedAt <= end; });
    var feas = scored.length ? scored.reduce(function (a, p) { return a + p.managerAssessment.score; }, 0) / scored.length : 0;
    // Tach so du an khoi dong trong thang theo trang thai hien tai
    var byS = { completed: 0, in_progress: 0, paused: 0, not_started: 0 };
    startedList.forEach(function (p) { byS[p.status]++; });
    out.push({ month: m, label: MONTHS_VI[m], projects: startedList.length, completed: done,
      hours: hours, feasibility: Math.round(feas * 10) / 10, byStatus: byS });
  }
  return out;
}

/** Làm tròn trục dọc lên số đẹp để chia vạch */
function niceMax(v) {
  if (v <= 4) return Math.max(1, Math.ceil(v));
  var p = Math.pow(10, Math.floor(Math.log(v) / Math.LN10));
  return Math.ceil(v / (p / 2)) * (p / 2);
}

function filterProjects(ps, q, f) {
  var t = q.trim().toLowerCase();
  return ps.filter(function (p) {
    if (t) {
      var g = goalOf(p.goal);
      var hay = [p.name, p.ownerName, p.department, p.tools.join(' '), p.description,
                 g.vi, g.en, p.goalNote || ''].join(' ').toLowerCase();
      if (hay.indexOf(t) === -1) return false;
    }
    if (f.status !== 'all' && p.status !== f.status) return false;
    if (f.goal !== 'all' && p.goal !== f.goal) return false;
    if (f.department !== 'all' && p.department !== f.department) return false;
    if (f.owner !== 'all' && p.ownerName !== f.owner) return false;
    if (f.tool !== 'all' && p.tools.indexOf(f.tool) === -1) return false;
    if (f.month !== 'all' && p.startDate.slice(5, 7) !== f.month) return false;
    if (f.minFeas !== 'all') {
      var sc = p.managerAssessment ? p.managerAssessment.score : -1;
      if (sc < Number(f.minFeas)) return false;
    }
    return true;
  });
}

function sortProjects(ps, key, dir) {
  var sign = dir === 'asc' ? 1 : -1;
  function val(p) {
    switch (key) {
      case 'name': return p.name;
      case 'ownerName': return p.ownerName;
      case 'department': return p.department;
      case 'status': return STATUS_ORDER.indexOf(p.status);
      case 'startDate': return p.startDate;
      case 'expectedCompletionDate': return p.expectedCompletionDate;
      case 'goal': return goalOf(p.goal).vi;
      case 'feas': return p.managerAssessment ? p.managerAssessment.score : -1;
      case 'progress': return p.progress;
      default: return p.startDate;
    }
  }
  return ps.slice().sort(function (a, b) {
    var x = val(a), y = val(b);
    if (typeof x === 'number') return (x - y) * sign;
    return String(x).localeCompare(String(y), 'vi') * sign;
  });
}

/* ══════════════════════════════════════════════════════════════════
   5. SERVICE — mock bất đồng bộ, sau này thay bằng API thật

var AIProjectsService = {
  // Bat co nay de thu man hinh bao loi. Khong con nut bam tren giao dien;
  // muon thu thi mo Console cua trinh duyet va go:
  //   AIProjectsService.shouldFail = true; location.reload === undefined;
  // hoac don gian: AIProjectsService.shouldFail = true  roi bam nut Thu lai.
  shouldFail: false,
  normalizeProject: function (p) {
    var copy = Object.assign({}, p);
    copy.id = copy.id || AIProjectsService.newId();
    copy.ownerName = copy.ownerName || copy.owner_name || '';
    copy.department = copy.department || '';
    copy.status = copy.status || 'not_started';
    copy.goal = copy.goal || 'TIME';
    copy.description = copy.description || '';
    copy.problem = copy.problem || '';
    copy.proposedSolution = copy.proposedSolution || copy.proposed_solution || '';
    copy.tools = Array.isArray(copy.tools) ? copy.tools.slice() : [];
    copy.activity = Array.isArray(copy.activity) ? copy.activity.slice() : [];
    copy.comments = Array.isArray(copy.comments) ? copy.comments.slice() : [];
    copy.startDate = copy.startDate || copy.start_date || '';
    copy.expectedCompletionDate = copy.expectedCompletionDate || copy.expected_completion_date || '';
    copy.actualCompletionDate = copy.actualCompletionDate || copy.actual_completion_date || '';
    copy.pauseReason = copy.pauseReason || copy.pause_reason || '';
    copy.createdAt = copy.createdAt || copy.created_at || new Date().toISOString();
    copy.updatedAt = copy.updatedAt || copy.updated_at || copy.createdAt;
    copy.goalNote = copy.goalNote || copy.goal_note || '';
    copy.expectedHoursSavedPerMonth = copy.expectedHoursSavedPerMonth != null ? copy.expectedHoursSavedPerMonth : (copy.expected_hours_saved_per_month != null ? copy.expected_hours_saved_per_month : 0);
    copy.actualHoursSavedPerMonth = copy.actualHoursSavedPerMonth != null ? copy.actualHoursSavedPerMonth : (copy.actual_hours_saved_per_month != null ? copy.actual_hours_saved_per_month : 0);
    copy.progress = copy.progress != null ? Number(copy.progress) : 0;
    var score = copy.managerAssessment && copy.managerAssessment.score != null ? copy.managerAssessment.score : copy.manager_assessment_score;
    var comment = copy.managerAssessment && copy.managerAssessment.comment ? copy.managerAssessment.comment : copy.manager_assessment_comment;
    copy.managerAssessment = (score != null || comment) ? { score: Number(score || 0), comment: comment || '' } : null;
    return copy;
  },
  getProjects: function () {
    var self = this;
    return new Promise(function (resolve, reject) {
      setTimeout(function () {
        if (self.shouldFail) { self.shouldFail = false; reject(new Error('NETWORK')); return; }
        var client = window.aiProjects && window.aiProjects.getSupabaseClient ? window.aiProjects.getSupabaseClient() : null;
        if (client) {
          client.from('projects').select('*').order('updated_at', { ascending: false }).then(function (result) {
            if (result.error) {
              var local = window.aiProjects.readLocal();
              resolve(local.length ? local : MOCK_PROJECTS);
              return;
            }
            resolve((result.data || []).map(function (p) { return self.normalizeProject(p); }));
          }).catch(function () {
            var local = window.aiProjects.readLocal();
            resolve(local.length ? local : MOCK_PROJECTS);
          });
          return;
        }
        var local = window.aiProjects.readLocal();
        resolve(local.length ? local : MOCK_PROJECTS);
      }, 750);
    });
  },
  // Cot id tren Supabase la uuid nen id moi phai dung dinh dang uuid
  newId: function () {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
  },
  reportSyncError: function (err) {
    console.error('Supabase sync failed:', err);
    toast('Lỗi lưu lên máy chủ: ' + (err && err.message ? err.message : 'không rõ'));
  },
  deleteProject: function (id) {
    var self = this;
    var client = window.aiProjects && window.aiProjects.getSupabaseClient ? window.aiProjects.getSupabaseClient() : null;
    if (!client) return Promise.resolve();
    return client.from('projects').delete().eq('id', id).then(function (result) {
      if (result.error) self.reportSyncError(result.error);
    });
  },
  persistProjects: function (projects) {
    var self = this;
    var normalized = (projects || []).map(function (p) { return this.normalizeProject(p); }, this);
    var client = window.aiProjects && window.aiProjects.getSupabaseClient ? window.aiProjects.getSupabaseClient() : null;
    // Cot kieu date khong nhan chuoi rong
    var dateOrNull = function (v) { return v ? v : null; };
    if (client) {
      client.from('projects').upsert(normalized.map(function (p) {
        return {
          id: p.id,
          name: p.name,
          owner_name: p.ownerName,
          department: p.department,
          status: p.status,
          goal: p.goal,
          description: p.description,
          problem: p.problem,
          proposed_solution: p.proposedSolution,
          tools: p.tools,
          progress: p.progress,
          expected_hours_saved_per_month: p.expectedHoursSavedPerMonth,
          actual_hours_saved_per_month: p.actualHoursSavedPerMonth,
          manager_assessment_score: p.managerAssessment ? p.managerAssessment.score : null,
          manager_assessment_comment: p.managerAssessment ? p.managerAssessment.comment : null,
          start_date: dateOrNull(p.startDate),
          expected_completion_date: dateOrNull(p.expectedCompletionDate),
          actual_completion_date: dateOrNull(p.actualCompletionDate),
          pause_reason: p.pauseReason,
          created_at: p.createdAt,
          updated_at: p.updatedAt,
          comments: p.comments,
          activity: p.activity
        };
      }), { onConflict: 'id' }).then(function (result) {
        if (result.error) self.reportSyncError(result.error);
        window.aiProjects.persistLocal(normalized);
      }).catch(function (err) {
        self.reportSyncError(err);
        window.aiProjects.persistLocal(normalized);
      });
      return Promise.resolve(normalized);
    }
    window.aiProjects.persistLocal(normalized);
    return Promise.resolve(normalized);
  }
};

function stars(value, editable, size, actName) {
  var html = '<div class="sw-stars" role="' + (editable ? 'radiogroup' : 'img') + '" aria-label="'
    + (editable ? 'Chọn mức khả thi' : 'Mức khả thi ' + value + ' trên 10') + '">';
  for (var n = 1; n <= 10; n++) {
    var on = n <= value;
    html += '<button type="button" class="sw-star" data-on="' + on + '" aria-label="' + n + ' trên 10"'
      + (editable ? ' data-act="' + actName + '" data-score="' + n + '"' : ' disabled tabindex="-1"') + '>'
      + ic('star', size || 20, on ? 'fill="currentColor"' : '') + '</button>';
  }
  return html + '</div>';
}
function selectHtml(id, act, value, options, extraClass, active) {
  var opts = options.map(function (o) {
    return '<option value="' + esc(o.v) + '"' + (String(o.v) === String(value) ? ' selected' : '') + '>' + esc(o.t) + '</option>';
  }).join('');
  return '<div class="sw-selwrap' + (extraClass ? ' ' + extraClass : '') + '"'
    + (active ? ' data-active="true"' : '') + '>'
    + '<select class="sw-select" ' + (id ? 'id="' + id + '" ' : '') + 'data-act="' + act + '">' + opts + '</select>'
    + ic('chevdown', 15) + '</div>';
}

function periodBarHtml() {
  var years = [];
  S.projects.forEach(function (p) { var y = p.startDate.slice(0, 4); if (years.indexOf(y) === -1) years.push(y); });
  years.sort().reverse();
  if (years.indexOf(S.period.year) === -1 && years.length) S.period.year = years[0];

  var modes = [['all', 'Tất cả'], ['year', 'Theo năm'], ['month', 'Theo tháng']];
  var scoped = scopedProjects();
  var note;
  if (S.period.mode === 'all') {
    note = 'Toàn bộ danh mục · ' + S.projects.length + ' dự án';
  } else {
    var end = periodEndISO();
    var endTxt = S.period.mode === 'year'
      ? '31/12/' + S.period.year
      : lastDayOfMonth(S.period.year, S.period.month);
    note = 'Lũy kế đến ' + endTxt + ' · ' + scoped.length + ' dự án';
  }

  return '<div class="sw-periodbar">'
    + '<span class="sw-periodlab">' + ic('calendar', 15) + ' Kỳ báo cáo</span>'
    + '<div class="sw-seg" role="group" aria-label="Chế độ kỳ báo cáo">'
    + modes.map(function (mo) {
        return '<button data-on="' + (S.period.mode === mo[0]) + '" data-act="pmode" data-key="' + mo[0] + '">'
          + esc(mo[1]) + '</button>';
      }).join('')
    + '</div>'
    + (S.period.mode !== 'all'
      ? selectHtml(null, 'pyear', S.period.year, years.map(function (y) { return { v: y, t: 'Năm ' + y }; }), 'sw-psel', true)
      : '')
    + (S.period.mode === 'month'
      ? selectHtml(null, 'pmonth', S.period.month,
          MONTHS_VI.map(function (t, i) { return { v: String(i + 1).padStart(2, '0'), t: 'Tháng ' + (i + 1) }; }),
          'sw-psel', true)
      : '')
    + '<span class="sw-periodnote">' + esc(note) + '</span>'
    + (S.period.mode !== 'all'
      ? '<button class="sw-btn sw-btn--ghost sw-btn--sm" data-act="preset">' + ic('x', 15) + ' Bỏ kỳ</button>' : '')
    + '</div>';
}
/** Ngày cuối tháng dạng dd/mm/yyyy, có tính năm nhuận */
function lastDayOfMonth(y, mm) {
  var d = new Date(Number(y), Number(mm), 0);
  return String(d.getDate()).padStart(2, '0') + '/' + mm + '/' + y;
}

function kpiCard(icon, tone, value, decimals, suffix, label, note, trend) {
  var text = decimals ? value.toFixed(decimals).replace('.', ',') : fmtN(Math.round(value));
  return '<div class="sw-card sw-kpi">'
    + '<div class="sw-kpi-top">'
    + '<div class="sw-kpi-ico" style="background:var(--' + tone + '-soft);color:var(--' + tone + ')">' + ic(icon, 16) + '</div>'
    + '<div class="sw-kpi-lab">' + esc(label) + '</div>'
    + '</div>'
    + '<div class="sw-kpi-valrow">'
    + '<div class="sw-kpi-val sw-num" data-kpi="' + value + '" data-dec="' + (decimals || 0) + '">' + text
    + (suffix ? '<small>' + esc(suffix) + '</small>' : '') + '</div>'
    + (trend ? '<span class="sw-kpi-trend" style="color:var(--' + trend.tone + ')">' + ic('trending', 12) + esc(trend.text) + '</span>' : '')
    + '</div>'
    + '<div class="sw-kpi-note">' + esc(note || '') + '</div>'
    + '</div>';
}
function kpiHtml() {
  var ps = scopedProjects(), total = ps.length;
  var done = byStatus(ps, 'completed').length;
  var paused = byStatus(ps, 'paused').length;
  return '<div class="sw-kpi-grid">'
    + kpiCard('layers', 'accent', total, 0, '', 'Tổng dự án', '')
    + kpiCard('playcircle', 'info', byStatus(ps, 'in_progress').length, 0, '', 'Đang làm', '')
    + kpiCard('checkcircle', 'success', done, 0, '', 'Hoàn thành', '',
        { tone: 'success', text: Math.round((done / Math.max(total, 1)) * 100) + '%' })
    + kpiCard('dashed', 'warning', byStatus(ps, 'not_started').length, 0, '', 'Chưa làm', '')
    + kpiCard('pausecircle', 'danger', paused, 0, '', 'Tạm dừng', '')
    + kpiCard('gauge', 'accent', avgFeasibility(ps), 1, '/10', 'Khả thi TB',
        assessedCount(ps) + '/' + total + ' đã chấm')
    + kpiCard('clock', 'success', monthlyHoursSaved(ps), 0, ' h', 'Giờ tiết kiệm',
        'mỗi tháng · ' + timeProjectCount(ps) + ' dự án')
    + '</div>';
}
// Đếm tăng dần cho các số KPI, chỉ chạy lần đầu sau khi tải xong
function animateKpis() {
  if (S.kpiAnimated) return;
  S.kpiAnimated = true;
  var els = document.querySelectorAll('[data-kpi]');
  Array.prototype.forEach.call(els, function (el) {
    var target = Number(el.getAttribute('data-kpi'));
    var dec = Number(el.getAttribute('data-dec'));
    var small = el.querySelector('small');
    var suffix = small ? small.outerHTML : '';
    var t0 = performance.now(), dur = 850;
    function step(now) {
      var t = Math.min(1, (now - t0) / dur);
      var e = 1 - Math.pow(1 - t, 3);
      var cur = target * e;
      el.innerHTML = (dec ? cur.toFixed(dec).replace('.', ',') : fmtN(Math.round(cur))) + suffix;
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

/* ══════════════════════════════════════════════════════════════════
   9. PHÂN TÍCH THEO THÁNG — biểu đồ SVG tự vẽ
   ══════════════════════════════════════════════════════════════════ */
/** Màn hình hẹp (điện thoại) hay không — dùng cho biểu đồ */
function isNarrow() { return window.innerWidth <= 560; }
/** Duoi 1100px thi 2 cot xep doc thay vi nam ngang */
function isStacked() { return window.innerWidth <= 1100; }

var METRICS = [
  { key: 'status',      label: 'Dự án theo trạng thái', short: 'Trạng thái', unit: 'dự án',   type: 'stack' },
  { key: 'hours',       label: 'Giờ tiết kiệm',         short: 'Giờ',        unit: 'h/tháng', type: 'bar' },
  { key: 'feasibility', label: 'Khả thi TB',            short: 'Khả thi',    unit: '/10',     type: 'line' }
];

// Thứ tự xếp chồng, từ dưới lên trên
var STACK_ORDER = ['completed', 'in_progress', 'paused', 'not_started'];
var STACK_COLOR = {
  completed:   'var(--success)',
  in_progress: 'var(--info)',
  paused:      'var(--warning)',
  not_started: 'var(--text-3)'
};

/** Vẽ hình chữ nhật chỉ bo tròn 2 góc trên (dùng cho đoạn trên cùng của cột chồng) */
function topRoundedRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h);
  return 'M' + x + ',' + (y + h)
    + 'V' + (y + r) + 'a' + r + ',' + r + ' 0 0 1 ' + r + ',' + (-r)
    + 'h' + (w - 2 * r) + 'a' + r + ',' + r + ' 0 0 1 ' + r + ',' + r
    + 'V' + (y + h) + 'Z';
}

/** Sinh path cho mot lat cat cua vong tron donut */
function donutArc(cx, cy, rOut, rIn, a0, a1) {
  var large = (a1 - a0) > Math.PI ? 1 : 0;
  var x0 = cx + rOut * Math.cos(a0), y0 = cy + rOut * Math.sin(a0);
  var x1 = cx + rOut * Math.cos(a1), y1 = cy + rOut * Math.sin(a1);
  var x2 = cx + rIn * Math.cos(a1),  y2 = cy + rIn * Math.sin(a1);
  var x3 = cx + rIn * Math.cos(a0),  y3 = cy + rIn * Math.sin(a0);
  return 'M' + x0 + ',' + y0
    + 'A' + rOut + ',' + rOut + ' 0 ' + large + ' 1 ' + x1 + ',' + y1
    + 'L' + x2 + ',' + y2
    + 'A' + rIn + ',' + rIn + ' 0 ' + large + ' 0 ' + x3 + ',' + y3 + 'Z';
}

function goalInnerHtml() {
  var ps = scopedProjects();
  var dist = goalDistribution(ps);
  var total = ps.length;
  if (!total) return '';

  var SZ = 150, cx = SZ / 2, cy = SZ / 2, rOut = 66, rIn = 42;
  var a = -Math.PI / 2, gap = dist.length > 1 ? 0.03 : 0;
  var slices = '';
  dist.forEach(function (d) {
    var span = (d.count / total) * Math.PI * 2;
    var on = S.filters.goal === d.code;
    var dim = (S.filters.goal !== 'all' && !on) ? 0.28 : 1;
    slices += '<path class="dslice" data-act="goal-pick" data-goal="' + d.code + '" '
      + 'd="' + donutArc(cx, cy, on ? rOut + 5 : rOut, rIn, a + gap / 2, a + span - gap / 2) + '" '
      + 'fill="' + d.color + '" opacity="' + dim + '"><title>' + esc(d.vi) + ': ' + d.count
      + ' dự án (' + d.pct.toFixed(0) + '%)</title></path>';
    a += span;
  });

  var center = '<text x="' + cx + '" y="' + (cy - 2) + '" text-anchor="middle" font-size="28" '
    + 'font-weight="700" fill="var(--text-1)" style="letter-spacing:-1px">' + total + '</text>'
    + '<text x="' + cx + '" y="' + (cy + 16) + '" text-anchor="middle" font-size="11" '
    + 'fill="var(--text-3)">dự án</text>';

  var rows = dist.map(function (d) {
    var on = S.filters.goal === d.code;
    return '<button class="sw-goalrow' + (on ? ' on' : '') + '" data-act="goal-pick" data-goal="' + d.code + '">'
      + '<i style="background:' + d.color + '"></i>'
      + '<span class="nm">' + esc(d.vi) + '<em>' + esc(d.en) + '</em></span>'
      + '<span class="pc sw-num" style="color:' + d.color + '">' + d.pct.toFixed(0) + '%</span>'
      + '<span class="ct sw-num">' + d.count + '</span></button>';
  }).join('');

  return '<div class="sw-goalhead"><div>'
    + '<h2 class="sw-h2">Phân bổ theo mục tiêu</h2>'
    + '<p class="sw-meta" style="margin-top:4px">Bấm để lọc danh sách bên dưới</p></div>'
    + (S.filters.goal !== 'all'
      ? '<button class="sw-btn sw-btn--ghost sw-btn--sm" data-act="goal-clear">' + ic('x', 15) + ' Bỏ lọc</button>' : '')
    + '</div>'
    + '<div class="sw-goalbody">'
    + '<svg class="sw-donut" viewBox="0 0 ' + SZ + ' ' + SZ + '" role="img" '
    + 'aria-label="Vòng tròn phân bổ dự án theo mục tiêu">' + slices + center + '</svg>'
    + '<div class="sw-goallist">' + rows + '</div>'
    + '</div>';
}

function analyticsInnerHtml() {
  var ps = scopedProjects();
  var years = [];
  // Danh sách năm lấy từ TOÀN BỘ dữ liệu, không phụ thuộc kỳ đang chọn
  S.projects.forEach(function (p) { var y = p.startDate.slice(0, 4); if (years.indexOf(y) === -1) years.push(y); });
  years.sort().reverse();
  if (years.indexOf(S.chart.year) === -1 && years.length) S.chart.year = years[0];
  var CY = chartYear();

  var stats = monthlyStats(ps, CY);
  var hl = highlightMonth();
  var m = METRICS.filter(function (x) { return x.key === S.chart.metric; })[0] || METRICS[0];

  // Giá trị tổng của từng tháng, dùng để tính chiều cao cột
  var totals = stats.map(function (s) {
    if (m.type === 'stack') return s.projects;
    return s[m.key];
  });

  // ---- Khung vẽ: bám sát bề rộng thật để chữ luôn ~11px ----
  var narrow = isNarrow();
  var stacked = isStacked();
  // Be rong that cua cot trai: bo padding shell -> padding card -> ty le 62% -> nua khe ho
  var inner = Math.min(1440, window.innerWidth) - (narrow ? 28 : 48) - (narrow ? 28 : 44);
  var W = Math.max(300, Math.round(stacked ? inner : inner * 0.62 - 14));
  var H = narrow ? 200 : 236;
  var PL = narrow ? 30 : 38;             // chừa chỗ cho nhãn trục dọc
  var PR = 8, PB = 26, PT = 16;
  var FS = narrow ? 10.5 : 11.5;
  var iw = W - PL - PR, ih = H - PB - PT, step = iw / 12;
  function X(i) { return PL + step * i + step / 2; }

  var maxV = niceMax(Math.max.apply(null, totals.concat([m.key === 'feasibility' ? 10 : 1])));
  if (m.key === 'feasibility') maxV = 10;
  function Y(v) { return PT + ih - (v / maxV) * ih; }

  var act = S.chart.active;
  var sel = act !== null ? stats[act] : null;
  var animCls = S.chart.animated ? '' : ' seg-in';
  S.chart.animated = true;

  /* ---------- Dòng số liệu lớn phía trên ---------- */
  var totalYear, readCtx;
  if (m.type === 'stack') {
    totalYear = totals.reduce(function (a, b) { return a + b; }, 0);
    readCtx = sel ? 'khởi động tháng ' + (sel.month + 1) + '/' + CY : 'khởi động cả năm ' + CY;
  } else if (m.key === 'hours') {
    totalYear = Math.max.apply(null, totals);
    readCtx = sel ? 'tháng ' + (sel.month + 1) + '/' + CY : 'mức cao nhất năm ' + CY;
  } else {
    totalYear = totals.filter(function (v) { return v; }).slice(-1)[0] || 0;
    readCtx = sel ? 'tháng ' + (sel.month + 1) + '/' + CY : 'cuối năm ' + CY;
  }
  var readVal = sel ? (m.type === 'stack' ? sel.projects : sel[m.key]) : totalYear;
  var readNum = m.key === 'feasibility' ? String(readVal).replace('.', ',') : fmtN(readVal);

  /* ---------- Bắt đầu dựng SVG ---------- */
  var svg = '<svg class="sw-chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" '
    + 'role="img" aria-label="Biểu đồ ' + esc(m.label) + ' theo tháng năm ' + CY + '">';

  // Lưới ngang + nhãn trục dọc
  [0, 0.5, 1].forEach(function (f) {
    var yy = PT + ih * f;
    var val = maxV * (1 - f);
    svg += '<line x1="' + PL + '" x2="' + (W - PR) + '" y1="' + yy + '" y2="' + yy
      + '" stroke="var(--border-1)" stroke-width="1"/>'
      + '<text x="' + (PL - 8) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="' + (FS - 0.5)
      + '" fill="var(--text-3)">' + (m.key === 'feasibility' ? val : fmtN(Math.round(val))) + '</text>';
  });

  if (m.type === 'stack') {
    var bw = Math.min(narrow ? 20 : 34, step * 0.56);
    stats.forEach(function (s, i) {
      var yCursor = PT + ih;   // dựng từ đáy lên
      var segs = '';
      var drawn = 0, totalSeg = 0;
      STACK_ORDER.forEach(function (k) { if (s.byStatus[k] > 0) totalSeg++; });
      STACK_ORDER.forEach(function (k) {
        var v = s.byStatus[k];
        if (!v) return;
        drawn++;
        var h = (v / maxV) * ih;
        yCursor -= h;
        var isTop = drawn === totalSeg;
        var fill = STACK_COLOR[k];
        var op = (act === null || act === i) ? 1 : 0.3;
        if (hl !== null && i !== hl && act !== i) op = 0.22;   // ngoài tháng đang chọn
        segs += isTop
          ? '<path d="' + topRoundedRect(X(i) - bw / 2, yCursor, bw, h, Math.min(5, bw / 2))
            + '" fill="' + fill + '" opacity="' + op + '"/>'
          : '<rect x="' + (X(i) - bw / 2) + '" y="' + yCursor + '" width="' + bw + '" height="' + h
            + '" fill="' + fill + '" opacity="' + op + '"/>';
      });
      svg += '<g class="hit seg' + animCls + '" data-i="' + i + '" style="--d:' + (i * 35) + 'ms">'
        + '<rect x="' + (X(i) - step / 2) + '" y="' + PT + '" width="' + step + '" height="' + ih + '" fill="transparent"/>'
        + segs + '</g>';
    });
  } else if (m.type === 'bar') {
    var bw2 = Math.min(narrow ? 20 : 34, step * 0.56);
    stats.forEach(function (s, i) {
      var v = s[m.key], h = maxV ? (v / maxV) * ih : 0;
      svg += '<g class="hit seg' + animCls + '" data-i="' + i + '" style="--d:' + (i * 35) + 'ms">'
        + '<rect x="' + (X(i) - step / 2) + '" y="' + PT + '" width="' + step + '" height="' + ih + '" fill="transparent"/>'
        + '<path d="' + topRoundedRect(X(i) - bw2 / 2, PT + ih - h, bw2, Math.max(h, v > 0 ? 3 : 0), 5)
        + '" fill="var(--accent)" opacity="'
        + ((hl !== null && i !== hl && act !== i) ? 0.22 : ((act === null || act === i) ? 1 : 0.3)) + '"/></g>';
    });
  } else {
    var d = stats.map(function (s, i) { return (i ? 'L' : 'M') + X(i) + ',' + Y(s[m.key]); }).join(' ');
    svg += '<path d="' + d + '" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>';
    stats.forEach(function (s, i) {
      svg += '<g class="hit" data-i="' + i + '">'
        + '<rect x="' + (X(i) - step / 2) + '" y="' + PT + '" width="' + step + '" height="' + ih + '" fill="transparent"/>'
        + '<circle cx="' + X(i) + '" cy="' + Y(s[m.key]) + '" r="' + (act === i ? 6 : 3.6)
        + '" fill="var(--surface-solid)" stroke="var(--accent)" stroke-width="2.6"/></g>';
    });
  }

  // Nhãn tên tháng
  stats.forEach(function (s, i) {
    svg += '<text x="' + X(i) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="' + FS + '" '
      + 'fill="' + (act === i || hl === i ? 'var(--text-1)' : 'var(--text-3)') + '" '
      + 'font-weight="' + (act === i || hl === i ? 700 : 500) + '">' + s.label + '</text>';
  });

  /* ---------- Ô chú thích nổi khi chạm vào cột ---------- */
  if (sel) {
    var rows = [];
    if (m.type === 'stack') {
      STACK_ORDER.forEach(function (k) {
        if (sel.byStatus[k] > 0) rows.push({ c: STACK_COLOR[k], t: STATUS[k].label, v: sel.byStatus[k] });
      });
      if (!rows.length) rows.push({ c: 'var(--text-3)', t: 'Không có dự án', v: '' });
    } else {
      rows.push({ c: 'var(--accent)', t: m.label, v: (m.key === 'feasibility' ? String(sel[m.key]).replace('.', ',') : fmtN(sel[m.key])) });
    }
    var tw = narrow ? 132 : 152, rh = 17, th = 24 + rows.length * rh;
    var tx = Math.max(PL, Math.min(W - PR - tw, X(act) - tw / 2));
    var ty = Math.max(2, PT - 6);
    svg += '<g class="tip" pointer-events="none">'
      + '<rect x="' + tx + '" y="' + ty + '" width="' + tw + '" height="' + th + '" rx="10" '
      + 'fill="var(--surface-solid)" stroke="var(--border-2)" stroke-width="1"/>'
      + '<text x="' + (tx + 10) + '" y="' + (ty + 16) + '" font-size="' + (FS - 0.5)
      + '" font-weight="700" fill="var(--text-1)">Tháng ' + (sel.month + 1) + '</text>';
    rows.forEach(function (r, i) {
      var yy = ty + 24 + i * rh + 9;
      svg += '<rect x="' + (tx + 10) + '" y="' + (yy - 6) + '" width="7" height="7" rx="2" fill="' + r.c + '"/>'
        + '<text x="' + (tx + 22) + '" y="' + yy + '" font-size="' + (FS - 0.5) + '" fill="var(--text-2)">' + esc(r.t) + '</text>'
        + '<text x="' + (tx + tw - 10) + '" y="' + yy + '" text-anchor="end" font-size="' + (FS - 0.5)
        + '" font-weight="700" fill="var(--text-1)">' + r.v + '</text>';
    });
    svg += '</g>';
  }
  svg += '</svg>';

  /* ---------- Chú giải màu ---------- */
  var legend = '';
  if (m.type === 'stack') {
    legend = '<div class="sw-legend">' + STACK_ORDER.map(function (k) {
      return '<span class="sw-legend-i"><i style="background:' + STACK_COLOR[k] + '"></i>' + esc(STATUS[k].label) + '</span>';
    }).join('') + '</div>';
  }

  return '<div class="sw-anl-head"><div>'
    + '<h2 class="sw-h2">Phân tích danh mục theo tháng</h2>'
    + '<p class="sw-meta" style="margin-top:4px">Chạm vào cột để xem chi tiết từng tháng</p></div>'
    + (S.period.mode === 'all'
      ? selectHtml(null, 'chart-year', S.chart.year, years.map(function (y) { return { v: y, t: 'Năm ' + y }; }))
      : '<span class="sw-chip" style="align-self:flex-start">' + ic('calendar', 13) + 'Năm ' + CY + '</span>')
    + '</div>'
    + '<div class="sw-anl-read"><b class="sw-num">' + readNum + '</b>'
    + '<span style="color:var(--text-2);font-size:14px">' + esc(m.unit) + ' · ' + esc(readCtx) + '</span></div>'
    + '<div class="sw-anl-tabs" role="tablist">'
    + METRICS.map(function (x) {
        return '<button class="sw-anl-tab" data-on="' + (S.chart.metric === x.key) + '" role="tab" '
          + 'aria-selected="' + (S.chart.metric === x.key) + '" data-act="chart-metric" data-key="' + x.key + '">'
          + esc(x.short) + '</button>';
      }).join('')
    + '</div>' + svg + legend;
}

/** Ba chỉ số tổng hợp, trải ngang đáy khung */
function insFootHtml() {
  var ps = scopedProjects();
  var potential = totalExpectedHours(ps), realized = monthlyHoursSaved(ps);
  return '<div class="sw-anl-foot">'
    + '<div><span>Tổng tiềm năng nếu triển khai hết</span><b class="sw-num">' + fmtN(potential * 12) + ' h / năm</b></div>'
    + '<div><span>Đã thực sự tiết kiệm được</span><b class="sw-num" style="color:var(--success)">' + fmtN(realized * 12) + ' h / năm</b></div>'
    + '<div><span>Tỷ lệ hiện thực hóa</span><b class="sw-num">' + (potential ? Math.round((realized / potential) * 100) : 0) + '%</b></div>'
    + '</div>';
}

/** Khung ghép: trái là phân tích theo tháng, phải là phân bổ theo mục tiêu */
function insightsHtml() {
  return '<div class="sw-card sw-insights">'
    + '<div class="sw-ins-cols">'
    + '<div class="sw-ins-left" id="sw-anl-inner">' + analyticsInnerHtml() + '</div>'
    + '<div class="sw-ins-right" id="sw-goal-inner">' + goalInnerHtml() + '</div>'
    + '</div>'
    + '<div id="sw-ins-foot">' + insFootHtml() + '</div>'
    + '</div>';
}

/* ══════════════════════════════════════════════════════════════════
   10. BỘ LỌC + DANH SÁCH
   ══════════════════════════════════════════════════════════════════ */
function uniqBy(ps, k) {
  var out = [];
  ps.forEach(function (p) { if (out.indexOf(p[k]) === -1) out.push(p[k]); });
  return out.sort(function (a, b) { return a.localeCompare(b, 'vi'); });
}
function filtersHtml() {
  var ps = S.projects;
  var groups = [
    { k: 'status', o: [{ v: 'all', t: 'Mọi trạng thái' }].concat(STATUS_ORDER.map(function (s) { return { v: s, t: STATUS[s].label }; })) },
    { k: 'goal', o: [{ v: 'all', t: 'Mọi mục tiêu' }].concat(GOALS.map(function (g) { return { v: g.code, t: g.vi }; })) },
    { k: 'department', o: [{ v: 'all', t: 'Mọi phòng ban' }].concat(uniqBy(ps, 'department').map(function (d) { return { v: d, t: d }; })) },
    { k: 'owner', o: [{ v: 'all', t: 'Mọi người phụ trách' }].concat(uniqBy(ps, 'ownerName').map(function (d) { return { v: d, t: d }; })) },
    { k: 'tool', o: [{ v: 'all', t: 'Mọi công cụ' }].concat(TOOL_LIST.map(function (d) { return { v: d, t: d }; })) },
    { k: 'month', o: [{ v: 'all', t: 'Mọi tháng' }].concat(MONTHS_VI.map(function (t, i) { return { v: String(i + 1).padStart(2, '0'), t: 'Bắt đầu ' + t }; })) },
    { k: 'minFeas', o: [{ v: 'all', t: 'Mọi mức khả thi' }, { v: '9', t: 'Khả thi từ 9' }, { v: '8', t: 'Khả thi từ 8' }, { v: '7', t: 'Khả thi từ 7' }, { v: '5', t: 'Khả thi từ 5' }] }
  ];
  var n = activeFilterCount();
  return groups.map(function (g) {
    return selectHtml(null, 'filter:' + g.k, S.filters[g.k], g.o, null, S.filters[g.k] !== 'all');
  }).join('')
    + (n > 0 ? '<button class="sw-btn sw-btn--ghost sw-btn--sm" data-act="reset-filters">' + ic('trash', 15) + ' Xóa lọc (' + n + ')</button>' : '');
}
function activeFilterCount() {
  var n = 0;
  for (var k in S.filters) if (S.filters[k] !== 'all') n++;
  return n;
}

function projectCardHtml(p) {
  var isDone = p.status === 'completed' && p.actualHoursSavedPerMonth != null;
  var hLab = isDone ? 'Thực tế' : 'Kỳ vọng';
  var hVal = isDone ? p.actualHoursSavedPerMonth : p.expectedHoursSavedPerMonth;
  var hTone = isDone ? 'var(--success)' : 'var(--text-1)';

  var feas = p.managerAssessment
    ? '<span style="display:flex;align-items:center;gap:7px">'
      + ic('star', 16, 'fill="#F0A500" stroke="#F0A500"')
      + '<span class="sw-num" style="font-size:19px;font-weight:650">' + p.managerAssessment.score
      + '<small style="font-size:12.5px;font-weight:540;color:var(--text-3)">/10</small></span></span>'
    : '<span style="display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--warning);font-weight:560">'
      + ic('alert', 14) + ' Chưa đánh giá</span>';

  var foot = '<button class="sw-btn sw-btn--sm" data-act="open" data-id="' + p.id + '">Xem chi tiết</button>';
  if (p.status === 'in_progress') {
    foot += '<button class="sw-btn sw-btn--sm sw-btn--primary" data-act="complete" data-id="' + p.id + '">'
      + ic('check', 15) + ' Hoàn thành</button>'
      + '<button class="sw-icon-btn" style="width:36px;height:36px;flex:0 0 auto" data-act="pause" data-id="' + p.id
      + '" aria-label="Tạm dừng" title="Tạm dừng">' + ic('pausecircle', 17) + '</button>';
  } else if (p.status === 'not_started') {
    foot += '<button class="sw-btn sw-btn--sm sw-btn--primary" data-act="open" data-id="' + p.id + '">Bắt đầu</button>';
  }

  return '<article class="sw-card sw-proj">'
    + '<div style="display:flex;gap:12px;align-items:flex-start;justify-content:space-between">'
    + '<h3 class="sw-proj-title">' + esc(p.name) + '</h3>' + statusBadge(p.status) + '</div>'
    + '<div class="sw-proj-metas">'
    + '<span class="sw-proj-meta">' + ic('user', 14) + esc(p.ownerName) + '</span>'
    + '<span class="sw-proj-meta">' + ic('building', 14) + esc(p.department) + '</span>'
    + '<span class="sw-proj-meta">' + ic('calendar', 14) + fmtD(p.startDate) + ' → ' + fmtD(p.expectedCompletionDate) + '</span>'
    + '</div>'
    + '<p class="sw-proj-desc">' + esc(p.description) + '</p>'
    + toolChips(p.tools, 4)
    + '<div style="display:flex;gap:14px">'
    + '<div class="sw-proj-block" style="flex:1"><span class="sw-proj-tag">Giờ tiết kiệm · ' + hLab + '</span>'
    + '<span class="sw-num" style="font-size:19px;font-weight:650;color:' + hTone + '">' + fmtN(hVal)
    + '<small style="font-size:12.5px;font-weight:540;color:var(--text-3)"> h/tháng</small></span></div>'
    + '<div class="sw-proj-block" style="flex:1"><span class="sw-proj-tag">Mức khả thi</span>' + feas + '</div>'
    + '</div>'
    + '<div class="sw-proj-block"><span class="sw-proj-tag">Tiến độ</span>' + progressBar(p.progress) + '</div>'
    + '<div class="sw-proj-foot">' + foot + '</div></article>';
}

var COLS = [
  { key: 'name', t: 'Dự án' }, { key: 'ownerName', t: 'Phụ trách' },
  { key: 'department', t: 'Phòng ban' }, { key: 'status', t: 'Trạng thái' },
  { key: 'startDate', t: 'Bắt đầu' }, { key: 'expectedCompletionDate', t: 'Dự kiến xong' },
  { key: 'goal', t: 'Mục tiêu' }, { key: 'feas', t: 'Khả thi' }, { key: 'progress', t: 'Tiến độ' }
];

function tableHtml(list) {
  var head = COLS.map(function (c) {
    var arrow = S.sort.key === c.key
      ? ic('chevdown', 13, 'style="transform:rotate(' + (S.sort.dir === 'asc' ? '180deg' : '0deg') + ')"') : '';
    return '<th><button data-act="sort" data-key="' + c.key + '">' + esc(c.t) + arrow + '</button></th>';
  }).join('') + '<th>Thao tác</th>';

  var rows = list.map(function (p) {
    return '<tr data-act="open" data-id="' + p.id + '" tabindex="0">'
      + '<td style="font-weight:580;max-width:260px">' + esc(p.name) + '</td>'
      + '<td style="color:var(--text-2)">' + esc(p.ownerName) + '</td>'
      + '<td style="color:var(--text-2)">' + esc(p.department) + '</td>'
      + '<td>' + statusBadge(p.status) + '</td>'
      + '<td class="sw-num" style="color:var(--text-2)">' + fmtD(p.startDate) + '</td>'
      + '<td class="sw-num" style="color:var(--text-2)">' + fmtD(p.expectedCompletionDate) + '</td>'
      + '<td>' + goalChip(p.goal) + '</td>'
      + '<td class="sw-num">' + (p.managerAssessment
        ? '<span style="font-weight:580">' + p.managerAssessment.score + '/10</span>'
        : '<span style="color:var(--warning);font-size:12.5px">Chưa chấm</span>') + '</td>'
      + '<td style="min-width:130px">' + progressBar(p.progress) + '</td>'
      + '<td><button class="sw-btn sw-btn--sm sw-btn--ghost" data-act="open" data-id="' + p.id + '">Mở' + ic('arrowup', 14) + '</button></td>'
      + '</tr>';
  }).join('');

  var compact = list.map(function (p) {
    return '<button class="sw-lrow" data-act="open" data-id="' + p.id + '">'
      + '<span style="min-width:0"><span style="display:block;font-weight:600;margin-bottom:4px">' + esc(p.name) + '</span>'
      + '<span class="sw-meta">' + esc(p.ownerName) + ' · ' + esc(p.department) + ' · ' + p.progress + '%</span></span>'
      + '<span style="display:flex;align-items:center;gap:8px;flex-shrink:0">' + statusBadge(p.status)
      + ic('chevright', 17) + '</span></button>';
  }).join('');

  return '<div class="sw-card" style="overflow:hidden">'
    + '<div class="sw-tablewrap"><table class="sw-table"><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div>'
    + '<div class="sw-listcompact">' + compact + '</div></div>';
}

function emptyHtml() {
  return '<div class="sw-card sw-empty"><div class="sw-empty-ico">' + ic('search', 26) + '</div>'
    + '<h3 class="sw-h2">Không có dự án nào khớp</h3>'
    + '<p class="sw-sub" style="margin:0">Thử đổi từ khóa tìm kiếm hoặc bỏ bớt bộ lọc.</p>'
    + '<button class="sw-btn" data-act="reset-filters" style="margin-top:6px">Xóa bộ lọc</button></div>';
}
function errorHtml() {
  return '<div class="sw-card sw-empty">'
    + '<div class="sw-empty-ico" style="background:var(--danger-soft);color:var(--danger)">' + ic('alert', 26) + '</div>'
    + '<h3 class="sw-h2">Không tải được danh sách dự án</h3>'
    + '<p class="sw-sub" style="margin:0">Kết nối tới máy chủ đã bị gián đoạn. Kiểm tra mạng rồi thử lại.</p>'
    + '<button class="sw-btn sw-btn--primary" data-act="retry" style="margin-top:6px">' + ic('refresh', 16) + ' Thử lại</button></div>';
}
function skeletonHtml() {
  var kpi = '';
  for (var i = 0; i < 6; i++) {
    kpi += '<div class="sw-card sw-kpi">'
      + '<div class="sw-skel" style="width:34px;height:34px;border-radius:11px"></div>'
      + '<div class="sw-skel" style="width:58%;height:26px"></div>'
      + '<div class="sw-skel" style="width:78%;height:12px"></div></div>';
  }
  var rows = '';
  for (var j = 0; j < 8; j++) {
    rows += '<div class="sw-skel" style="height:22px;margin:14px"></div>';
  }
  return '<div class="sw-kpi-grid">' + kpi + '</div>'
    + '<div class="sw-card sw-skel" style="height:330px;margin-top:26px"></div>'
    + '<div class="sw-card" style="margin-top:26px;padding:6px 0">' + rows + '</div>';
}

function visibleProjects() {
  return sortProjects(filterProjects(S.projects, S.q, S.filters), S.sort.key, S.sort.dir);
}

function bodyHtml() {
  var list = visibleProjects();
  var n = activeFilterCount();
  return '<div class="sw-section-head">'
    + '<div class="sw-filters sw-filters-desktop">' + filtersHtml() + '</div>'
    + '<div class="sw-filters-mobile"><button class="sw-btn sw-btn--sm" data-act="toggle-filters">'
    + ic('sliders', 16) + ' Bộ lọc'
    + (n > 0 ? '<span class="sw-badge" style="background:var(--accent);color:#fff;padding:1px 7px">' + n + '</span>' : '')
    + '</button></div>'
    + '<div style="display:flex;gap:12px;align-items:center;margin-left:auto">'
    + '<span class="sw-meta sw-num">' + list.length + '/' + S.projects.length + ' dự án</span>'
    + '</div></div>'
    + (S.showFilters ? '<div class="sw-card" style="padding:16px;margin-bottom:16px"><div class="sw-filters" style="flex-direction:column;align-items:stretch">' + filtersHtml() + '</div></div>' : '')
    + (list.length === 0 ? emptyHtml() : tableHtml(list));
}

function mainHtml() {
  if (S.loading) return skeletonHtml();
  if (S.error) return errorHtml();
  return '<div id="sw-period">' + periodBarHtml() + '</div>'
    + '<div id="sw-kpiwrap">' + kpiHtml() + '</div>'
    + '<div class="sw-section" id="sw-insights">' + insightsHtml() + '</div>'
    + '<div class="sw-section" id="sw-body">' + bodyHtml() + '</div>';
}

/* ══════════════════════════════════════════════════════════════════
   11. CHI TIẾT DỰ ÁN (drawer)
   ══════════════════════════════════════════════════════════════════ */
var UI = { assessEdit: false, assessScore: 0, assessComment: '' };

function sec(icon, title, inner) {
  return '<section class="sw-dsec"><div class="sw-dsec-t">' + ic(icon, 14) + esc(title) + '</div>' + inner + '</section>';
}

function assessmentHtml(p) {
  var a = p.managerAssessment;
  if (UI.assessEdit) {
    return '<div class="sw-dbox" style="padding:15px 16px;display:flex;flex-direction:column;gap:14px">'
      + '<div><div class="sw-label" style="margin-bottom:8px">Mức khả thi (1 – 10)</div>'
      + stars(UI.assessScore, true, 22, 'assess-score')
      + '<div class="sw-num" style="font-size:20px;font-weight:660;margin-top:8px">'
      + (UI.assessScore || '—') + '<span style="font-size:13px;color:var(--text-3);font-weight:540">/10</span></div></div>'
      + '<div class="sw-field"><label class="sw-label" for="dt-cmt-assess">Nhận xét của quản lý</label>'
      + '<textarea id="dt-cmt-assess" class="sw-textarea" placeholder="Nêu rõ căn cứ đánh giá, điều kiện cần chuẩn bị, rủi ro chính…">'
      + esc(UI.assessComment) + '</textarea></div>'
      + '<div style="display:flex;gap:10px">'
      + '<button class="sw-btn sw-btn--sm" style="flex:1" data-act="assess-cancel">Hủy</button>'
      + '<button class="sw-btn sw-btn--sm sw-btn--primary" style="flex:1"' + (UI.assessScore ? '' : ' disabled')
      + ' data-act="assess-save">Lưu đánh giá</button></div></div>';
  }
  var body = a
    ? stars(a.score, false, 19)
      + '<div class="sw-num" style="font-size:24px;font-weight:680;margin-top:10px">' + a.score
      + '<span style="font-size:14px;font-weight:540;color:var(--text-3)">/10</span></div>'
      + '<p class="sw-body" style="margin-top:10px">“' + esc(a.comment) + '”</p>'
      + '<p class="sw-meta" style="margin-top:8px">' + esc(a.managerName) + ' · đánh giá ngày ' + fmtD(a.evaluatedAt) + '</p>'
    : '<div style="display:flex;align-items:center;gap:9px;color:var(--warning);font-weight:560">'
      + ic('alert', 17) + ' Chưa đánh giá</div>';
  var footer = isManager()
    ? '<button class="sw-btn sw-btn--sm" style="margin-top:14px" data-act="assess-edit">'
      + (a ? 'Sửa đánh giá' : 'Chấm mức khả thi') + '</button>'
    : '<p class="sw-meta" style="margin-top:14px;display:flex;align-items:center;gap:6px">'
      + ic('shield', 14) + ' Chỉ quản lý mới được chấm mức khả thi</p>';
  return '<div class="sw-dbox" style="padding:15px 16px">' + body + footer + '</div>';
}

function detailHtml() {
  var p = findP(S.detailId);
  if (!p) return '';
  var pos = Math.min(100, Math.max(0, p.progress));
  var actM = p.actualHoursSavedPerMonth;

  var timeline = '<div class="sw-tl"><div class="sw-tl-track">'
    + '<div class="sw-tl-fill" style="width:' + pos + '%"></div>'
    + '<div class="sw-tl-lab" id="dt-proglab" style="left:' + pos + '%">' + pos + '%</div>'
    + '<div class="sw-tl-dot" style="left:' + pos + '%"></div></div>'
    + '<div class="sw-tl-ends"><span>' + fmtD(p.startDate) + '</span><span>' + fmtD(p.expectedCompletionDate) + '</span></div></div>'
    + '<div class="sw-dgrid" style="margin-top:12px">'
    + '<div class="sw-dbox"><span>Dự kiến hoàn thành</span><b class="sw-num">' + fmtD(p.expectedCompletionDate) + '</b></div>'
    + '<div class="sw-dbox"><span>Thực tế hoàn thành</span><b class="sw-num" style="color:'
    + (p.actualCompletionDate ? 'var(--success)' : 'var(--text-3)') + '">'
    + (p.actualCompletionDate ? fmtD(p.actualCompletionDate) : 'Chưa xong') + '</b></div></div>'
    + (p.status === 'in_progress'
      ? '<div style="margin-top:14px"><label class="sw-label" for="dt-prog">Cập nhật tiến độ</label>'
        + '<input id="dt-prog" type="range" min="0" max="100" step="1" value="' + p.progress
        + '" style="width:100%;margin-top:8px;accent-color:var(--accent);height:28px"></div>'
      : '');

  var gInfo = goalOf(p.goal);
  var impact = '<div style="margin-bottom:12px">' + goalChip(p.goal)
    + '<span class="sw-meta" style="margin-left:8px">' + esc(gInfo.en) + '</span></div>'
    + (p.goalNote ? '<div class="sw-dbox" style="border-left:3px solid ' + gInfo.color + ';margin-bottom:12px">'
        + '<span>Giải thích</span><p class="sw-body" style="margin-top:4px;color:var(--text-1)">'
        + esc(p.goalNote) + '</p></div>' : '')
    + (p.goal === 'TIME' ? '<div class="sw-dgrid">'
      + '<div class="sw-dbox"><span>Kỳ vọng</span><b class="sw-num">' + fmtN(p.expectedHoursSavedPerMonth) + ' h/tháng</b>'
      + '<div class="sw-meta sw-num" style="margin-top:3px">' + fmtN(p.expectedHoursSavedPerMonth * 12) + ' h/năm</div></div>'
      + '<div class="sw-dbox"' + (actM != null ? ' style="background:var(--success-soft)"' : '') + '><span>Thực tế</span>'
      + (actM != null
        ? '<b class="sw-num" style="color:var(--success)">' + fmtN(actM) + ' h/tháng</b>'
          + '<div class="sw-meta sw-num" style="margin-top:3px">' + fmtN(actM * 12) + ' h/năm</div>'
        : '<b style="color:var(--text-3)">Chưa có</b>') + '</div></div>' : '')
    + (actM != null && p.goal === 'TIME'
      ? '<p class="sw-meta" style="margin-top:10px">Chênh lệch so với kỳ vọng: <b style="color:'
        + (actM >= p.expectedHoursSavedPerMonth ? 'var(--success)' : 'var(--warning)') + '">'
        + (actM >= p.expectedHoursSavedPerMonth ? '+' : '') + fmtN(actM - p.expectedHoursSavedPerMonth) + ' h/tháng</b></p>'
      : '')
    + (p.actualResult
      ? '<div class="sw-dbox" style="margin-top:10px"><span>Kết quả thực tế</span>'
        + '<p class="sw-body" style="margin-top:4px;color:var(--text-1)">' + esc(p.actualResult) + '</p></div>'
      : '');

  var comments = (p.comments.length === 0 ? '<p class="sw-meta">Chưa có bình luận nào.</p>' : '')
    + p.comments.map(function (c) {
        return '<div class="sw-cmt"><div class="sw-avatar">' + esc(initials(c.author)) + '</div>'
          + '<div style="min-width:0"><div style="font-size:13.5px;font-weight:600">' + esc(c.author)
          + '<span class="sw-meta" style="font-weight:400;margin-left:8px">' + fmtD(c.at) + '</span></div>'
          + '<p class="sw-body" style="font-size:13.8px;margin-top:2px">' + esc(c.text) + '</p></div></div>';
      }).join('')
    + '<div style="display:flex;gap:8px;margin-top:10px">'
    + '<input class="sw-input" id="dt-cmt" placeholder="Viết bình luận…" aria-label="Viết bình luận">'
    + '<button class="sw-btn" data-act="cmt-send">Gửi</button></div>';

  var activity = p.activity.map(function (a) {
    return '<div style="display:flex;gap:10px;padding:7px 0;align-items:baseline">'
      + '<span style="width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0"></span>'
      + '<span style="font-size:13.8px">' + esc(a.text) + '</span>'
      + '<span class="sw-meta" style="margin-left:auto;flex-shrink:0">' + fmtD(a.at) + '</span></div>';
  }).join('');

  var foot = '';
  if (p.status === 'not_started') {
    foot = '<button class="sw-btn sw-btn--primary" data-act="start" data-id="' + p.id + '">'
      + ic('playcircle', 17) + ' Bắt đầu triển khai</button>';
  } else if (p.status === 'in_progress') {
    foot = '<button class="sw-btn" data-act="pause" data-id="' + p.id + '">' + ic('pausecircle', 17) + ' Tạm dừng</button>'
      + '<button class="sw-btn sw-btn--primary" data-act="complete" data-id="' + p.id + '">' + ic('check', 17) + ' Hoàn thành dự án</button>';
  } else if (p.status === 'paused') {
    foot = '<button class="sw-btn sw-btn--primary" data-act="resume" data-id="' + p.id + '">'
      + ic('playcircle', 17) + ' Tiếp tục triển khai</button>';
  } else {
    foot = '<div style="display:flex;align-items:center;gap:8px;color:var(--success);font-weight:580;padding:6px 4px">'

/* ---- MUC 3 & 4: tu dong viet hoa khi go ----
   titleCase: viet hoa chu cai dau MOI TU  -> dung cho ten nguoi
   sentenceCase: viet hoa chu cai dau TU DAU TIEN -> dung cho ten du an */
function titleCase(str) {
  return str.replace(/(^|[\s(\-])(\S)/g, function (m, a, b) { return a + b.toLocaleUpperCase('vi'); });
}
function sentenceCase(str) {
  if (!str) return str;
  return str.charAt(0).toLocaleUpperCase('vi') + str.slice(1);
}
// Ap dung phep bien doi ma van giu nguyen vi tri con tro
function applyCase(el, fn) {
  var pos = null;
  try { pos = el.selectionStart; } catch (e) {}
  var nv = fn(el.value);
  if (nv !== el.value) {
    el.value = nv;
    if (pos !== null) { try { el.setSelectionRange(pos, pos); } catch (e) {} }
  }
  return el.value;
}

function wizValid() {
  var d = WIZ.draft;
  if (WIZ.step === 0) return !!(d.name.trim() && d.ownerName.trim() && d.startDate && d.expectedCompletionDate);

    if (!d.description.trim() || !d.tools.length || !d.goal) return false;
    // Muc tieu Giam thoi gian bat buoc nhap so gio
    if (d.goal === 'TIME' && (d.expectedHoursSavedPerMonth === '' || Number(d.expectedHoursSavedPerMonth) <= 0)) return false;
    return true;
  }
  return true;
}
